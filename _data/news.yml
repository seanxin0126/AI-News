- title: 摩根士丹利：五大云巨头与英伟达等AI相关表外承诺超过3.1万亿美元
  description: 摩根士丹利表示，五家超大规模云服务商以及芯片公司英伟达和博通通过担保、租赁及其他形式的财务支持，合计承诺超过3.1万亿美元，以帮助其他企业推进AI基础设施支出。这五家超大规模云服务商分别是Alphabet、亚马逊、Meta、微软和甲骨文。Todd
    Castagno带领的分析师团队在报告中写道，Alphabet的承诺规模最高，达到8900亿美元，主要涉及采购承诺。这些公司的2027年现金资本开支预计将超过1.2万亿美元，而预期现金流约为1万亿美元。（财联社）
  url: https://36kr.com/newsflashes/3955569527225477?f=rss
  source: 36kr.com
