- title: 全球资管巨头二季度持仓“大洗牌”，科技股操作分歧显著
  description: 随着美国证券交易委员会（SEC）13F持仓文件披露完成，全球顶级资管机构的投资“路线图”浮出水面。最新数据显示，以贝莱德、桥水为代表的华尔街巨头在科技股，尤其是半导体产业链上，展开了激烈的多空博弈，调仓方向泾渭分明。与此同时，太空经济以及多个AI产业链细分赛道正获得越来越多长线资金的关注。（上证报）
