- title: Anthropic优化Fable 5生物安全机制，将减少85%相关误拦截
  description: 当地时间8月7日，人工智能公司Anthropic表示，已更新Claude Fable 5的生物安全机制，通过优化分类器显著减少误拦截。在测试中，此次更新使产品各平台与生物相关的“降级切换”（fallback）次数减少约85%，用户可使用Fable
