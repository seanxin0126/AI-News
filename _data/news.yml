- title: Lambda正洽谈至多30亿美元的融资
  description: 据知情人士透露，获得英伟达投资的人工智能云计算服务商Lambda正洽谈至多30亿美元的融资，本轮融资或将为其明年上市铺路。知情人士称，这家属于“新云厂商”阵营、对外出租芯片及其他AI基础设施的企业，正讨论以最高120亿美元或更高估值完成本轮融资；因相关谈判尚未公开，知情人士要求匿名。他们表示，融资谈判仍在进行，交易条款尚未敲定。总部位于加州的Lambda已经收到多份本轮融资的投资意向书，部分接近该公司的人士表示，这笔融资或将让其最早于明年启动IPO。部分知情人士称，该公司今年营收预计将超过15亿美元。（新浪财经）
