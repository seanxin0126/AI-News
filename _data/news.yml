- title: 781家公司晒出成绩单，上半年创业板公司盈利能力显著提升
  description: 2026年上半年，创业板上市公司盈利能力显著提升。截至8月26日发稿，创业板1403家公司中有781家披露了2026年半年报。这781家公司合计实现营业收入1.61万亿元，同比增长24.04%；合计净利润、扣非净利润分别为1485.35亿元、1301.77亿元，同比增幅均超43%。业内人士认为，从整体来看，创业板公司收入快速增长，盈利水平显著提升，龙头企业引领增长，算力、人工智能（AI）等新质生产力相关产业释放强劲活力，充分展现创业板服务科技创新企业的发展韧性。（中证报）
  url: https://36kr.com/newsflashes/3956996054302080?f=rss
