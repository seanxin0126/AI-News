- title: 韩国8月出口继续强劲增长，AI需求推动芯片热潮
  description: 韩国8月出口继续强劲增长，人工智能（AI）需求提振芯片出货乃至整体经济，料支持韩国央行在连续两次加息后维持鹰派立场。韩国海关周二公布的数据显示，经工作日差异调整后，8月出口同比增长72.5%，进口增长22.5%，贸易顺差达到347亿美元。未经调整的出口增长68.7%，7月增幅经修正后为63%。半导体仍是韩国出口增长的主要动力。数据显示，尽管能源价格上涨和地缘政治紧张局势对其他行业构成压力，但外部需求依然具有韧性，支持韩国央行上周连续第二次会议加息25个基点。（新浪财经）
  url: https://36kr.com/newsflashes/3964159966010633?f=rss
  source: 36kr.com
