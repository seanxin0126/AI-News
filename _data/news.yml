- title: 众擎机器人等成立科技公司，智能无人飞行器制造业务
  description: 36氪获悉，企查查App显示，近日，上海星意擎坤科技有限公司成立，法定代表人为吕学敏，注册资本为6120万元，经营范围包含人工智能基础软件开发；智能机器人的研发；智能机器人销售；工业机器人销售；智能无人飞行器制造等。企查查股权穿透显示，该公司由深圳众擎机器人科技股份有限公司、上海傲意信息科技有限公司等共同持股。
