- title: AI算力需求驱动，玻纤行业上半年业绩普遍向好
  description: 玻纤行业龙头中国巨石8月20日披露半年报，今年上半年实现营业收入111.59亿元，同比增长22.5%；净利润29.33亿元，同比大幅增长73.87%。与此同时，中材科技、国际复材、金安国纪等多家产业链公司同期业绩呈现不同程度增长。在AI算力需求驱动下，玻纤及电子布行业景气度持续攀升，龙头企业正加速布局产能，一场围绕高端化、特种化的产能竞赛已然展开。（证券时报）
  url: https://36kr.com/newsflashes/3948518569426313?f=rss
  source: 36kr.com
- title: 韩国互联网巨头Kakao拟分拆核心业务以加强AI能力
  description: 韩国互联网巨头Kakao公司周五表示，计划将包括其热门即时通讯服务KakaoTalk在内的主要业务拆分为两个独立实体，以加强其人工智能（AI）能力。该公司在一份监管文件中表示，将公司拆分为KakaoAI和KakaoX的计划已在董事会会议上获得批准。Kakao计划于明年1月1日前完成分拆，并于1月27日重新上市KakaoAI。（新浪财经）
