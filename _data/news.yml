- title: 36氪首发｜上科大团队做具身世界模型基础设施，完成千万美元种子轮融资
  description: "作者 | 乔钰杰\n 编辑 | 袁斯来\n \n 本文约3200字，建议阅读7分钟\r\n\n \n 硬氪获悉，具身智能基础设施公司「瞬适科技」（InstAdapt）近日完成千万美元种子轮融资，由协创智慧、云晖资本、浦东创投和吴越天使等机构联合投资，芯湃资本担任融资顾问。本轮资金将主要用于物理AI数据基础设施建设、具身世界模型研发以及核心团队扩充。\n\
