- title: a16z旗下机器时代基金筹集11亿美元，将投向芯片、机器人等硬件领域
  description: 当地时间8月28日，硅谷知名风险投资公司Andreessen Horowitz（a16z）宣布硬件正式确立为公司的核心方向，并为旗下机器时代基金（Machine
    Age Fund）筹集11亿美元。该基金将投资于AI运行所依赖的所有计算机基础设施，包括芯片、内存、网络和存储，还包括运行AI的完整系统：从数据中心到机器人，再到家用AI设备。该公司介绍，其最近投资了多家硬件公司，包括Unconventional
    AI、Nexthop、Volta、Atoms和Mind Robotics。（界面）
  url: https://36kr.com/newsflashes/3961454329609601?f=rss
