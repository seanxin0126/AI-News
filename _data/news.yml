- title: 老板电器研发加码：AI岗位同比增长47%，上半年有效专利561件
  description: 8月27日，老板电器半年报显示，公司持续加码AI烹饪研发投入。截至2026年6月底，公司拥有近千名技术人员，其中AI及智能关联岗位近180人，同比增长约47%；上半年有效专利达561件，其中有效发明专利171件，同比增长37.9%，近六年累计有效专利7640件，其中发明专利1012件，同比增长68.1%。研发体系方面，公司新设立AI未来厨房研究院和烹饪智能体研究院两大机构，覆盖"软件算法—硬件产品—场景探索—未来前瞻"全链路。公司还成立具身智能实验室，打造行业首个烹饪机器人训练平台。
  url: https://36kr.com/newsflashes/3958630165069186?f=rss
  source: 36kr.com
- title: 北京：推动人工智能、机器人等成为外贸发展的新动能
  description: 北京市副市长唐文弘在国新办新闻发布会上表示，面向“十五五”，我们将持续深化高水平对外开放，也就是以开放促改革促发展。一是积极扩大自主开放，推动服务业扩大开放综合示范区建设迭代升级。二是推动贸易创新发展。充分发挥北京科技创新和数字经济发展优势，推动人工智能、机器人等成为北京外贸发展的新动能；高标准建设国家服务贸易创新发展示范区、国家数字贸易示范区。三是提升双向投资合作水平。把开放机遇充分转化成发展红利，用“好政策+好服务”，支持外资企业深度融入北京现代化产业体系建设；做深做强北京海外综合服务平台，提升对外投资的质量…
