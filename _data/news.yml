- title: 借力智能化优势，主流车企跨界布局机器人
  description: 8月23日，2026世界机器人大会在北京落下帷幕。奇瑞汽车、广汽集团等多家主流车企投资研制的机器人集中亮相，“车企跨界造机器人”成为本届大会的看点之一，参展车企展示了汽车智能化技术正在向具身智能领域延伸。近日，比亚迪首款人形机器人“小迪”也完成全球首秀，并开始进行常态化服务。同时，均胜电子等汽车产业链企业也在跨界机器人领域。业内专家表示，随着汽车智能化浪潮，汽车业的造车人才和工程能力非常适合跨界赋能研制机器人，未来汽车企业大多会进入机器人行业，汽车和机器人的融合和协同发展将成为中国智能产业的重要趋势。（上证报）
  url: https://36kr.com/newsflashes/3952748660030593?f=rss
  source: 36kr.com
- title: Hugging Face据悉寻求出售，估值或超130亿美元
  description: 据报道，AI初创公司Hugging Face正寻求出售，公司估值可能达到至少130亿美元。据悉，Hugging Face正与一家银行合作评估潜在买家意向。此前，Hugging
    Face在2023年的一轮融资中估值达到45亿美元，该轮融资由包括Salesforce、Alphabe、谷歌和英伟达在内的科技巨头领投。（界面）
  url: https://36kr.com/newsflashes/3952740352228744?f=rss
  source: 36kr.com
- title: AI智能体能自主生成并运行量子计算代码
  description: 氛围编程（Vibe Coding）正从传统软件开发进入量子计算领域。据英国《自然》杂志日前消息，法国量子计算初创企业Pasqal研究人员开发出一种人工智能（AI）智能体，能根据英文自然语言指令生成量子计算代码，并自动在真实量子计算机上运行。研究人员表示，这种量子氛围编程有望降低量子计算实验的技术门槛，让更多人能够开展量子计算研究。（科技日报）
  url: https://36kr.com/newsflashes/3952708603362433?f=rss
  source: 36kr.com
- title: 政府倡導「AI對抗AI策略」　孫東：創新帶來新威脅亦能提升防禦力
  description: 人工智能(AI)發展日新月異，創新科技及工業局局長孫東表示，AI正以前所未有的速度重塑人們的生活，儘管創新有時會帶來新威脅，但同樣能提升防禦能力。他指，政府倡導以「AI對抗AI」的策略，利用AI建立最堅固的防禦屏障，以管理使用AI的相關風險。孫東出席一項活動時致辭稱，政府正持續加強AI相關政策、指引與道德框架，並定期舉辦網絡攻防演練作好網絡安全準備，希望透過多管齊下的措施，引導社會負責任地應用AI、構建健康的生態系統，並提升全港應對網絡攻擊的防禦韌性。
  url: https://hk.news.yahoo.com/%E6%94%BF%E5%BA%9C%E5%80%A1%E5%B0%8E-ai%E5%B0%8D%E6%8A%97ai%E7%AD%96%E7%95%A5-%E5%AD%AB%E6%9D%B1-%E5%89%B5%E6%96%B0%E5%B8%B6%E4%BE%86%E6%96%B0%E5%A8%81%E8%84%85%E4%BA%A6%E8%83%BD%E6%8F%90%E5%8D%87%E9%98%B2%E7%A6%A6%E5%8A%9B-110656921.html
