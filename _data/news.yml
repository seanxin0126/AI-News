- title: 微盟WAI升级为"微盟星元"，开启AI原生经营系统内测
  description: 36氪获悉，近日，微盟宣布旗下AI产品WAI升级为"微盟星元"，定位AI原生智能经营系统，目前开启内测。新产品将交互从传统图形界面转向自然语言（LUI），商家通过对话即可完成数据查询、经营诊断、店铺搭建、内容创作等动作。微盟将服务数千零售品牌积累的行业经验拆解为标准化、可独立调用的Skill模块，由Agent完成任务拆解与能力调度，并打通微信、企业微信、飞书、钉钉等渠道。
  url: https://36kr.com/newsflashes/3926051415161218
  source: 36kr.com
