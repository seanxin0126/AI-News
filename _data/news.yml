- title: 红杉中国据悉寻求为其单飞以来的首支美元基金募资12亿美元
  description: 据知情人士透露，红杉中国已与投资者就多支基金展开初步洽谈，其中包括其“单飞”以来的首支美元基金。知情人士称，该投资公司在商议为一支早期阶段投资基金募集至少12亿美元资金，以支持AI、医疗和消��领域的公司。红杉中国自2005年以来一直由沈南鹏掌舵。他们还说，红杉中国也考虑设立一只成长基金，但具体时间和规模尚未确定。其中一人补充说，该公司另外也在考虑一支人民币计价基金。此次募资将考验这家专注中国的老牌投资机构的号召力。原本红杉品牌伞下的三个实体就已然基本独立，一家专注美欧、一家专注中国，第三家聚焦印度和东南亚。拆分…
