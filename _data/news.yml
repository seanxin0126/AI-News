- title: 第三个InnoHK研发平台启动，香港投入25亿港元设立8个研发中心
  description: 今日（9月1日），由香港特区政府创新科技署与香港科技园公司合办的第三个InnoHK创新香港研发平台SEAM@InnoHK于香港科学园举行启动礼。InnoHK是特区政府的重点创新科技项目，旨在发展香港成为环球科研合作中心，此前已推出聚焦科技医疗的HEALTH@InnoHK及聚焦人工智能的AIR@InnoHK，此次推出的第三个研发平台SEAM@InnoHK将聚焦可持续发展、能源、先进制造及材料等领域。香港特区政府创新科技及工业局局长孙东致辞时指出，前两个平台目前已链接来自12个经济体超过30所顶尖大学及研究机构，汇集…
