- title: 获高瓴等基金数亿元投资，LatentVerse：不想被叫世界模型公司，要做具身原生大脑｜智能涌现首发
  description: "文｜邓咏仪\n 编辑｜张雨忻\n 具身智能赛道可能已经不需要再多一家世界模型公司了——但一位2001年出生的研究员，还是选择了在这个大热时分下场创业。\n\
