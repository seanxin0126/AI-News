- title: 黄仁勋发布首条X推文 支持开源模型
  description: "美国政府近来威胁审查中国开源人工智能（AI）大模型之际，英伟达公司CEO黄仁勋于当地时间7月24日在马斯克旗下社交媒体平台X（原推特）上，发布了自己的首条帖文，支持允许使用开源模型。\r\
    \n黄仁勋写道：“我的第一条帖文，分享一封英伟达签署的关于为什么开源模型如此重要的联名信。人工智能将改变各行各业，赋能每家公司，并由各个国家共同构建。开源模型能够增强安全性和网络安全，加速创新和普及，并保障国家主权。世界既需要前沿的闭源模型，也需要前沿的开源模型。”随后，黄仁勋附上了一封强调开源重要性与“美国人工智能领导力”的公开信，…"
