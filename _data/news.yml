- title: 何小鹏：亲自担任机器人业务CEO，将调动全集团优势资源共同协作，加速机器人量产和商业化
  description: 何小鹏表示，除担任小鹏CEO外，还亲自担任机器人业务CEO。小鹏在过去12年始终坚持软件和硬件的全栈自研，能够调动全集团的优势资源共同协作，把汽车业务积累的供应链、车规级制造、全球化布局以及自动驾驶业务积累的图灵AI芯片、AI
    Infra、物理世界基座模型的优势，整合应用在机器人业务板块，帮助小鹏机器人更快实现量产和商业化。（证券时报）
