- title: 公募基金持仓正向AI应用领域扩散
  description: 在人工智能（AI）赛道呈现高低切换的市场背景下，公募基金的持仓与资金意愿正向股价低位的AI应用领域扩散。记者注意到，随着软件、互联网、企业数字化相关标的迎来持续修复行情，公募基金投资逻辑也逐步从上游硬科技博弈，向有商业化落地能力的应用端企业聚焦。（证券时报）
  url: https://36kr.com/newsflashes/3927263486048644?f=rss
  source: 36kr.com
- title: 白宫AI审查排除美国开放权重模型
  description: 美国白宫4日向该国主要人工智能（AI）企业披露一份旨在测试尖端模型能力的框架，将美国开放权重模型列在审查范围外。多名知情人士当天向美媒披露这一消息。开放权重模型被视作广义上的开源模型，指那些公开权重文件、即训练完成后模型参数，并允许下载、本地部署及微调的AI模型，但这些模型不必公开训练数据、完整代码或训练流程。知情人士说，只有在性能基准测试中显示出“最先进”网络安全与攻击能力的封闭、拥有专利的美国模型，才须在发布前由开发企业自愿提交给政府进行测试。（新华社）
  url: https://36kr.com/newsflashes/3926454044473735?f=rss
  source: 36kr.com
- title: 腾讯云连续第二年入选Omdia全球游戏云平台“领导者”象限
  description: 36氪获悉，Omdia发布《Omdia市场雷达：2026全球游戏云平台》报告。报告显示，腾讯云连续第二年入选全球游戏云平台“领导者”（Leader）象限，是该象限中唯一一家中国大陆云厂商。这是继2025年首次入选后，腾讯云连续第二次获此评级。与报告发布同期，腾讯云首次对外披露AI在游戏行业的落地进展：近三个月，腾讯云游戏AI覆盖国内近150+游戏厂商，游戏行业整体AI
    Agent调用量同比增长超过三倍。
