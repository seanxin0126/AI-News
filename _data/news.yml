- title: 折价深达50%，美银称英伟达“极具吸引力”
  description: 8月19日消息，美银发布研报称，由于投资者夸大了英伟达公司所面临的风险，英伟达的股价可能被低估了多达50%。分析师在研报中写道，美银基于自由现金流用途的概念性分部估值法显示，即便考虑进融资风险，英伟达的股价仍有34%至50%的折让。分析师强调，投资者“可能夸大了风险，同时也创造了一个极具吸引力的机会”。英伟达周二下跌2.3%，收报219.74美元，与其它人工智能股齐跌。该股今年迄今上涨约18%，但仍比5月的峰值低了7%左右。（界面）
  url: https://36kr.com/newsflashes/3945662495014278?f=rss
  source: 36kr.com
- title: 英伟达到处给人“兜底融资”？“新债王”冈拉克：预示市场或见顶
  description: 随着英伟达与华尔街联手到处给人“兜底”融资，被业内誉为“新债王”的双线资本（DoubleLine Capital）首席执行官冈拉克最新警告称，华尔街试图将人工智能芯片变成可投资资产类别，这可能预示着市场即将见顶。
    冈拉克抨击了英伟达新近宣布的与六家金融巨头的合作关系，这些合作旨在为人工智能基础设施筹集超过5000亿美元的资金。英伟达将在其中扮演合作牵头方，而非出资方的角色。实际上就是利用其自身较高的信用评级，帮助控制客户的融资成本。（财联社）
  url: https://36kr.com/newsflashes/3944621198785923?f=rss
  source: 36kr.com
