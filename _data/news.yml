- title: 全球电商平台Etsy裁员12%，旨在精简业务并为增长布局
  description: 全球电商平台Etsy周三表示将裁员约220人，约占其员工总数的12%。这家在线集市正寻求简化组织架构，并在竞争日益激烈的电商行业中加快创新步伐。公司表示，大部分裁员将影响Etsy的产品和工程团队。Etsy发言人表示，此次裁员也并非由人工智能驱动。（新浪财经）
