- title: 英伟达CEO黄仁勋之女访问LG电子，讨论加强AI基础设施和机器人领域合作
  description: 8月18日，英伟达公司高级总监、首席执行官黄仁勋之女黄敏珊（Madison Huang）周二访问了位于韩国的LG电子机器人中心。黄敏珊与LG电子高管会面，探讨了双方在人工智能（AI）基础设施和机器人领域深化合作的方式。此次访问前，LG电子上周宣布，计划依托英伟达机器人平台，在2027年第一季度推出一款可双足行走的新一代人形机器人。（新浪财经）
  url: https://36kr.com/newsflashes/3944775566835081?f=rss
  source: 36kr.com
- title: 资金加速涌向硬科技赛道，A股并购重组聚焦“补链强链”
  description: 近期，上市公司并购重组热度不减。截至8月18日发稿时，Wind数据显示，以首次披露日期为口径，今年以来A股市场超2500家上市公司披露并购重组进展。重组标的集中于半导体、人工智能、高端装备、生物医药、新能源等战略性新兴产业，精准契合新质生产力发展方向，促进了技术、资本、产业的深度融合。市场人士认为，从研究设立国家级并购基金到常态化实施并购重组“绿色通道”机制，在政策持续推动下，我国并购市场有望延续活跃态势，符合现代化产业体系建设及新质生产力发展方向的领域成为发力重点，为经济高质量发展持续注入新动能。（中证报）
  url: https://36kr.com/newsflashes/3945667329457281?f=rss
  source: 36kr.com
- title: “思昇科技”完成数千万元种子+轮融资
  description: 36氪获悉，近日，AI驱动的超声脑机接口公司“思昇科技”宣布完成数千万元种子+轮融资。本轮融资由国汽投资领投，元禾璞华、全球健康产业创新中心（GHIC）跟投，老股东英诺科创基金、水木清华校友种子基金继续加注，由光源资本担任独家财务顾问。本轮资金将主要用于超声脑机接口核心技术研发、医疗器械产品���进、多模态脑数据与AI脑科学平台建设，以及跨学科人才团队扩充。
