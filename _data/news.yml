- title: 公募AI投资图谱：算力端“吃饱”，应用层“等风”
  description: 2026年上半年，公募基金在AI赛道的投资中达成高度共识。从最新披露的基金二季报来看，公募机构的目光以前所未有的力度向电子行业集中，AI算力硬件股几乎包揽了主动权益基金的重仓股榜单。在硬件投资火热的另一面，是应用端的投资结构性遇冷。同属AI产业链，硬件端已经“吃”到了业绩的肉，应用层还在等商业化的“风”。这种结构性分化主导了2026年上半年科技行情的节奏，也正在考验当前AI投资逻辑的可持续性。（中证报）
