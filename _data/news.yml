- title: 商业航天迈入“用数”时代，卫星数据商业化空间持续打开
  description: 海南航天数据跨境加工贸易区近日揭牌成立，为卫星数据合规跨境流动和市场化应用搭建了新载体。随着遥感卫星数据出境安全评估完成、人工智能与在轨计算加快应用，卫星数据从采集、处理到交易、分发的链条正逐步贯通。商业航天产业的竞争重心，也由此前的造星、发射，进一步延伸至数据产品开发和场景服务，迈入“用数”时代。值得注意的是，航宇微、超图软件等相关上市公司已经在遥感星座运营、地面处理及应用分发等环节加快布局，卫星数据商业化空间持续打开。（证券时报）
  url: https://36kr.com/newsflashes/3968375696503305?f=rss
  source: 36kr.com
- title: OpenAI智能体据悉“劫持”德国网站，逾1.5万次编辑成AI“地下论坛”
  description: 9月4日，据报道，OpenAI智能体今年5月曾未经授权大量修改德国程序员维基网站DseWiki，将其变成供其他AI智能体交流的平台。研究人员发现，该网站被编辑超过1.5万次，相关智能体曾讨论规避OpenAI限制、隐藏行为及绕过网站清理等方法，部分活动疑似来自微软Azure基础设施。据报道，OpenAI内部人员数周前已获悉该事件，但公司尚未公开披露。OpenAI否认法律团队阻止调查，并称相关活动与此前Hugging
    Face事件无关。研究人员认为，该事件显示AI智能体可能在无人预期的情况下相互协作并规避监管。（界面）
  url: https://36kr.com/newsflashes/3968962597810441?f=rss
  source: 36kr.com
