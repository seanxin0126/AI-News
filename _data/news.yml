- title: 报道：白宫正考虑对芯片征收新一轮关税
  description: 特朗普政府正考虑推出新一轮大范围半导体关税，尽管科技企业警告称，此举可能断送美国主导人工智能领域的希望。知情人士表示，特朗普政府正在考量的一项关税方案将大幅扩大征税科技产品的范围，征税对象不仅包含芯片，还可能波及大量使用芯片制造的产品，例如笔记本电脑、游戏主机，以及数据中心所用的服务器。（新浪财经）
