- title: 英美AI安全研究所发布对月之暗面Kimi K3网络安全能力的联合评估
  description: "英国人工智能安全研究所（UK AISI）与美国人工智能标准与创新中心（CAISI）于近日发布了一项联合评估报告，对月之暗面（Moonshot\
    \ AI）最新推出的模型 Kimi K3 的网络安全能力进行了深入测评。评估结果显示，尽管 Kimi K3 的网络能力超越了此前公认最强的开源模型 GLM-5.2，但与目前顶级的美国前沿闭源模型相比，仍存在较为明显的差距。\r\
    \n本次测试重点考察了 Kimi K3 在网络漏洞利用开发及模拟网络攻击等领域的实际表现。在卡内基梅隆大学开发的知名网络安全基准 ExploitBench\
