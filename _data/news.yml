- title: 特朗普政府设立新AI监管机构的计划陷入停滞
  description: 据报道，特朗普政府推动成立新的AI监管机构的行政命令目前陷入停滞，相关计划面临内部争议。据知情人士透露，特朗普政府近几周在内部传阅了一份行政命令草案，提议为开发尖端模型的人工智能企业设立一家行业自律机构。该命令的起草工作，是朝着建立这一监管机构迈出的重要一步，但目前仍存在诸多重大阻碍。另外三名知情人士表示，这份命令若要正式定稿，仍需获得包括总统在内的多名高级官员的支持，而近期相关推进工作已经陷入停滞。（新浪财经）
  url: https://36kr.com/newsflashes/3958525537795462?f=rss
  source: 36kr.com
- title: 软银寻求100亿美元贷款，为投资OpenAI融资债务再融资
  description: 据报道，软银集团正寻求一笔100亿美元、期限两年的贷款，用于为其投资美国人工智能公司OpenAI产生的债务进行再融资。该贷款利率预计为较有担保隔夜融资利率（SOFR）高275个基点，由瑞穗银行担任牵头行及簿记行。贷款所得资金部分可能用于偿还软银今年早些时候为投资OpenAI获得的400亿美元过桥贷款，该贷款承诺将于8月31日到期。软银预计到10月将向OpenAI投资近650亿美元。（界面）
  url: https://36kr.com/newsflashes/3958856790047872?f=rss
  source: 36kr.com
