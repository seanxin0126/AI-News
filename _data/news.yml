  description: "随着人工智能技术在校园内的快速普及，越来越多的高校开始重新审视AI检测工具的可靠性。因担心相关软件频频误判、引发学术争议，包括范德堡大学、耶鲁大学、约翰斯·霍普金斯大学、西北大学、滑铁卢大学、开普敦大学以及澳大利亚科廷大学在内的全球多家知名高等学府，已陆续宣布限制或彻底停用这类AI检测系统。\r\
    \n高校对学术诚信的担忧并非毫无依据。英国爱丁堡龙比亚大学此前对七所英国高校超6，600名学生发起调查，结果显示，32%受访学生承认曾在学术评估中未经授权使用过AI。自2022年底OpenAI推出ChatGPT以来，诸多大学纷…"
