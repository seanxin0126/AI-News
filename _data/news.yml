- title: A股科技板块修复进入业绩验证期，内部轮动和个股分化进一步加快
  description: 8月以来，全球科技资产逐步走出去杠杆冲击，半导体、存储、光通信等人工智能硬件方向率先回暖。在海外产业趋势映射和资金回补推动下，A股科技板块同步修复，光通信表现突出，行情也逐步向半导体、信创、机器人等方向扩散。不过，随着前期超跌修复持续推进，科技板块内部轮动和个股分化进一步加快。分析人士认为，A股科技产业趋势并未逆转，修复行情仍可期待，但市场定价逻辑正由资金驱动转向基本面验证，中报业绩、在手订单和产业需求能否持续兑现，将成为决定后续行情空间和结构的关键。（中证报）
  url: https://36kr.com/newsflashes/3945720822906243?f=rss
  source: 36kr.com
- title: 从成本传导走向AI需求共振，功率半导体行业迎景气周期
  description: 2026年上半年，功率半导体行业受益于AI（人工智能）服务器、新能源汽车、光储等领域需求爆发，叠加8英寸成熟制程产能紧缺，呈现景气度上行、量价齐升的发展态势。民德电子、扬杰科技、士兰微等产业链公司相继披露半年度业绩显示，功率半导体行业正从成本传导走向AI需求共振，一场由数据中心功率密度跃升引发的产业变局正在加速展开。（证券时报）
  url: https://36kr.com/newsflashes/3945686752361857?f=rss
  source: 36kr.com
