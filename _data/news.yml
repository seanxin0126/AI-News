- title: AI不缺需求缺算力，摩根士丹利警告供应瓶颈或持续数年
  description: 当地时间8月12日，摩根士丹利美国主题研究策略师Michelle Weaver表示，企业对人工智能的应用正日益产生实质性成效，但算力供应受限仍是制约增长的瓶颈。“我们的供应非常不足。我们看到算力在成为一种受限资源，”Weaver表示。“电力瓶颈、政治瓶颈、劳动力瓶颈——这些因素将在未来几年制约供应。”她表示，25%的标普500指数成分股公司如今可以量化AI投资带来的可衡量回报，高于一年前的14%。数据中心融资也十分充裕，英伟达与华尔街金融机构合作为AI基础设施筹集5,000亿美元就是例证。（界面）
  url: https://36kr.com/newsflashes/3937224303836548?f=rss
  source: 36kr.com
