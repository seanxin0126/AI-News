- title: 苹果被曝正在测试长鑫科技存储芯片，用于iPhone和MacBook
  description: 据《华尔街日报》8月9日报道，苹果公司正在其iPhone和MacBook等产品线中测试长鑫存储（CXMT）的存储芯片，以缓解因人工智能热潮引发的内存短缺问题。报道援引知情人士称，苹果公司已与中国最大的芯片制造商长鑫存储就零部件供应展开初步洽谈，目标是在中国销售的部分设备中使用这些芯片。路透社此前报道称，长鑫存储正考虑在北京建设第二座存储芯片工厂，以提高产能。此外，笔记本电脑制造商惠普（HP）和宏碁（Acer）已开始在销往美国以外市场的设备中使用长鑫存储的芯片，以缓解供应短缺。
    （中新经纬）
  url: https://36kr.com/newsflashes/3932875348868225?f=rss
  source: 36kr.com
- title: OpenAI等美企被曝旗下AI模型“越界”，安全风险引担忧
  description: 美国开放人工智能研究中心（OpenAI）7日发布声明称，最新的内部评估结果显示，该公司即将推出的人工智能模型“阿斯特拉”在“网络安全活动”方面，可能达到有严重风险��级别。该公司决定采取包括暂停涉及该模型的部分活动等安全保障措施。近期，美国多家企业陆续承认旗下人工智能模型在测试中“越界”，引发全球业界广泛关注。分析认为，此事除了技术失误等因素外，也存在商业炒作嫌疑。同时，AI风险日益凸显，全球需要加强安全监管。（央视新闻）
