- title: 白宫拟召集OpenAI和Anthropic等巨头 讨论AI模型安全测试框架
  description: 知情人士透露，特朗普政府计划于周二在白宫召集人工智能企业，讨论美国开展人工智能模型自愿安全测试的新框架。知情人士表示，计划出席会议的人工智能开发商包括OpenAI、Anthropic以及Alphabet
    Inc．旗下谷歌。这套近期完成制定的框架源于美国总统特朗普6月签署的人工智能网络安全行政令。这项行政令提出，对AI模型安全评估采取自愿参机制，并将加强关键计算机系统的安全防护。（新浪财经）
