- title: 36氪项目推荐周榜|第15期，本期热度TOP10
  description: "上一周，AI项目的竞争重点正在从“有没有模型”转向“能否进入真实业务”。有人试图把业务流程编译成智能体可调用的能力，有人从游戏、机器人数据、药企合规等细分场景切入，也有人在算力供给与冷链基础设施中寻找更具体的效率空间。\n\
    \ 本期上榜项目横跨企业服务、具身智能、医疗健康、合成生物与供应链服务。它们共同指向一个变化：技术不再只为制造新功能，而是在重新组织一套行业的工作方式。\n\
