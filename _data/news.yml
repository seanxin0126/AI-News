- title: 赋予机器人“空间直觉”，「Ommo Technologies」获数千万美元A轮融资｜36氪首发
  description: "文｜胡香赟\n 编辑｜海若镜\n 当AI开始尝试理解物理世界时，一个最基础的问题悄然浮出水面：机器人究竟如何感知自身在空间中的位置？\n\
    \ 视觉能告诉它看到了什么，编码器会告诉它关节转了多少度，力觉、触觉则会告诉它摸到了什么。但当机械手抓取柔软物体、手指相互遮挡，或进入狭小腔体的时候，所有这些传感方式都可能失效。因为，这些“物理条件下的天然局限”，会导致机器人丢失对自己末端位置的感知。\n\
    \ \n 图源：\n 这正是Ommo Technologies（下称“Ommo”），一家空间智能技术公司试图解决的问题。36氪获悉，近期，Om…"
