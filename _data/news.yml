  description: 据报道，三星电机与一家全球大型科技公司签署了一份价值1.07万亿韩元的多层陶瓷电容器（MLCC）长期供应协议（LTA），用于人工智能服务器。合同期限为一年，从2027年1月1日至2027年12月31日。
