- title: 消息称SpaceX收购Cursor交易最快下周完成，新产品或启用Grok品牌
  description: 8月7日，据报道，SpaceX收购AI编程工具公司Cursor的交易最快可能于下周末完成。Cursor品牌名称可能在未来几个月内逐步退出，新产品或采用其他品牌名称。据悉，Cursor即将推出的通用型智能代理产品可能被命名为Grok
    Bot。不过，Cursor现有工具不会立即更名。该交易仍需获得监管批准，预计最晚将在本月底前完成。SpaceX此前于6月宣布将以600亿美元收购Cursor。（界面新闻）
  url: https://36kr.com/newsflashes/3930219993922949?f=rss
  source: 36kr.com
- title: 王兴兴回应 DeepSeek 投资宇树：将展开重点合作；微信内测朋友圈 AI 新功能；美国科学家首次用AI设计出新型病毒｜极客早知道
  description: 'OpenAI 因 Astra 模型的网络安全能力而放缓其发布进程

