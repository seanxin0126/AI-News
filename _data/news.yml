- title: 谷歌拟本周推出Gemini 3.8 Flash，内部测试显示编码能力优于Opus
  description: 谷歌旗下人工智能研究部门DeepMind正准备推出一款编程能力大幅升级的新模型Gemini 3.8 Flash，内部代号为“Skimaki”。该模型最早可能于当地时间周三（9月2日）上线。知情员工称，这款模型的编码能力较此前版本有显著提升，公司正试图借此补上今年以来相对Anthropic、OpenAI旗舰模型的短板。不过，对外发布窗口尚未由公司正式宣布，行业标准基准分数也尚未公开。（新浪财经）
  url: https://36kr.com/newsflashes/3967040365944065?f=rss
  source: 36kr.com
- title: 特朗普政府支持OpenAI等人工智能公司：为训练模型复制作品不违反版权法
  description: 特朗普政府在一场大规模版权侵权诉讼中表态支持OpenAI及其他人工智能公司，此案牵扯美国多家大型出版机构，包括主流报纸、图书出版社、唱片公司以及数万名独立作者。美国司法部于当地时间周二发表声明，支持OpenAI在多家出版机构和多位作家提起的版权诉讼中所提出的“合理使用”抗辩。美国司法部指出，政府鼓励发展并维持美国在人工智能技术领域领导地位的政策，并敦促纽约联邦法官裁定，为训练大型语言模型而复制作品并不违反版权法。（新浪财经）
  url: https://36kr.com/newsflashes/3966961021852937?f=rss
  source: 36kr.com
