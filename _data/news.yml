- title: 韩国承诺放宽监管以支持以芯片和AI为核心的三大重点项目
  description: 韩国财政部周四表示，将放宽一系列包括行政程序在内的监管规定，以支持以半导体和人工智能（AI）设施为核心的三个重大产业项目。韩国财长具润哲在与经济相关部长举行的会议期间公布了该计划，预计这些措施将吸引总额达4.2万亿韩元（约合29.6亿美元）的投资。韩国财政部表示，“政府出台上述举措，旨在快速解决企业实际落地投资时遇到的各类难题，重点帮扶那些已具备开工条件、却因监管壁垒停滞不前的项目。”（新浪财经）
  url: https://36kr.com/newsflashes/3937214363614600?f=rss
  source: 36kr.com
- title: 中国移动：将推出全国统一的Token套餐资费
  description: 中国移动高管在今日的中期业绩说明会上表示，面向公众市场和政企市场，公司将推出全国统一的Token套餐资费，聚焦高频场景、高价值客户，打造Token、模型、流量、终端、权益等灵活组合、按需订购的科技服务组合。同时，公司在Token生产上将加速AIDC投产。据悉，上半年其Token运营取得阶段性进展，产品方面完成多档位Token资费设计，已在多省试点；平台方面打造统一的移动模型服务平台（MoMA），构建MoMA专属算力池；生态方面，接入头部企业模型和AI应用，持续丰富Token使用场景。（财联社）
  url: https://36kr.com/newsflashes/3937821986487430?f=rss
  source: 36kr.com
