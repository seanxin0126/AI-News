- title: 英伟达高管、黄仁勋之女将于周二到访LG电子机器人中心
  description: 行业消息人士周一透露，英伟达公司高级总监、首席执行官黄仁勋之女黄敏珊（Madison Huang）计划于本周晚些时候到访LG电子公司在韩国的机器人中心。黄敏珊定于周二访问，计划与LG电子高层官员就双方在人工智能（AI）基础设施和机器人领域深化合作的事宜举行闭门会谈。预计此次会谈将主要聚焦机器人业务，地点设在LG电子位于首尔南部正在建设的数据工厂。（新浪财经）
