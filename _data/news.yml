- title: 算力需求释放价值红利，上市公司竞逐先进封装
  description: 在AI产业发展带动下，各行业对高性能算力的需求不断增强，先进封装作为提升芯片性能的有效手段，成为上市公司重要布局方向。Wind数据显示，今年上半年，21家先进封装指数成份公司中，20家公司营收同比增长，18家公司归母净利润同比增长。多家上市公司披露先进封装业务进展，并加大研发投入、扩大产能。（中证报）
