- title: 工信部：将推动机器人产业聚焦2个关键环节、4个重点行业
  description: 在2026世界机器人大会开幕式上，工业和信息化部副部长辛国斌表示，站在新的历史起点上，工业和信息化部将深入贯彻落实党中央、国务院决策部署，紧紧把握“十五五”发展机遇，以智能化为主线，以实用化为牵引，统筹技术攻关、产业培育、场景拓展与安全治理，推动机器人产业创新发展。将聚焦核心零部件、具身智能等关键环节，打通产学研用创新链条。鼓励中外科研机构、企业开展联合攻关，打造一批先进、适用、易用的智能机器人标志性产品。将聚焦农业、医疗、养老、应急等应用空间广、示范效应强的重点行业，分类组织开展产用结对攻关、实地应用验证和成熟…
