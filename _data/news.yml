- title: 大型科技公司因持有其他人工智能企业的股权获利1600亿美元增益
  description: 大型科技巨头去年第四季度从投资其他人工智能企业中获得超过1600亿美元的账面收益，推高了盈利数据，也引发外界担忧：这些纸面收益可能夸大了人工智能热潮的实际强度。Alphabet、亚马逊、英伟达和微软在最近公布的业绩中均披露，税前利润受到“其他收入”项目的显著提振。该项目的收入主要来自其持有的其他领先人工智能企业股权的估值上涨。（新浪财经）
