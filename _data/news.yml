- title: 前Google Deepmind科学推理大模型主导研究者朱昊出任孚典智能CEO
  description: 36氪获悉，近日，孚典智能宣布，哈佛大学博士后、前谷歌 Deepmind科学推理大模型主导研究者朱昊出任公司首席执行官。朱昊长期在哈佛从事复杂系统建模、因果发现及大语言模型微调等研究，曾主导与DeepMind合作的科学推理大模型项目。朱昊表示，此次加入孚典智能核心任务是加速商业化落地，将技术壁垒转化为规模化收入。据了解，孚典智能聚焦大交通垂类AI，自研Floating
    EDI² OS平台，已在虹桥机场、浦东机场、香港机场、上海地铁等场景完成商业化落地，首轮市场化融资正在推进中。
