- title: CoreWeave新增风险提示：若需从英伟达芯片转向其他芯片将面临困难
  description: CoreWeave Inc．警告投资者，若要改变目前只使用英伟达人工智能（AI）芯片的状况，可能需要投入大量时间和资金。CoreWeave周三在申报文件中表示，客户需求的变化可能要求公司投入“时间、资金和资源”，以获取英伟达图形处理器（GPU）的替代产品。公司警告称，这最终可能影响其向客户提供所需产品的能力。CoreWeave是一家AI算力供应商，也是所谓的‘新型云服务商’（neoclouds）之一。（新浪财经）
