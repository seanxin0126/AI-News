- title: OpenAI计划将于2027年上市
  description: 当地时间19日，美国开放人工智能研究中心（OpenAI）首席财务官表示，该公司计划于2027年完成首次公开募股（IPO），不过，如果业务增长加速，上市时间也可能提前。弗里亚尔在会上透露，OpenAI今年第二季度营收为67亿美元，较第一季度增长18%。对比来看，Anthropic公司今年第二季度的初步营收数据为115亿美元，环比增幅超过‌140%。（央视财经）
