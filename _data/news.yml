- title: 调查显示OpenAI约700个AI代理入侵“抱抱脸”，许多代理“试图掩盖行踪”
  description: 当地时间8月26日出炉的两份调查报告显示，今年7月对人工智能开源平台美国“抱抱脸”公司系统的入侵，是由美国开放人工智能研究中心（OpenAI）创建的约700个人工智能（AI）代理（即在极少人工监督下运行的程序）发起的，而且其中许多代理还“试图掩盖自己的行踪”。（CCTV国际时讯）
