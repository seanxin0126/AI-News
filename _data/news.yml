- title: AMD宣布收购AI推理芯片初创公司Taalas
  description: AMD周四宣布达成协议，将收购总部位于多伦多的AI推理芯片初创公司Taalas，Taalas生产的芯片专为推理任务设计，其产品可针对单一AI模型进行定制或硬连线，而非通用型。牺牲通用性的代价换来的是，Taalas的这项技术可以打造成本更低的芯片。该公司称，针对特定模型，其芯片输出速度比传统GPU快数千倍。AMD未披露此次收购的具体金额。Taalas自2023年成立以来，累计已获得2.19亿美元风险投资。（新浪财经）
