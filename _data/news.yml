- title: 问界回应“预制车”传闻：纯属谣言，已报案
  description: 针对近期网络上有关问界M6某车型为“预制车”、“穿越车”的传闻，问界汽车发文表示，通过对车辆识别代号核实查证，该车辆的实际制造年月为“2026-7”，相关自媒体账号所发布或转载的车辆铭牌信息系经过P图或AI修改生成的虚假信息，由此而产生的公司生产“预制车”“穿越车”的说法纯属谣言。该公司表示，网络不是法外之地，目前其已保留证据并向公安机关报案。（财联社）
  url: https://36kr.com/newsflashes/3970035643199753?f=rss
  source: 36kr.com
