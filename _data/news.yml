- title: 中信证券：AI成美国经济增长重要驱动力
  description: 36氪获悉，中信证券研报指出，近几年，受生成式AI落地与云厂商数据中心扩张驱动，美国主要科技公司资本开支自2024年以来快速上升，AI投资占美国GDP比重也在近几年快速提升至10%。AI正在成为美国经济增长的重要驱动力，但同时AI发展在短期可能会对美国就业总量造成一定负面影响，并在未来影响美国就业结构。此外，AI快速发展导致的电力、芯片紧缺也一定程度推动了美国通胀压力。
