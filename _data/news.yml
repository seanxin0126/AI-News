- title: 硬氪首发 | 机器人力传感器企业完成数亿元D轮融资，广汽领投、红杉押注，市占率超70%
  description: "硬氪获悉，近日国内机器人力传感器企业蓝点触控完成数亿元人民币D轮融资。本轮融资由广汽集团旗下广汽资本领投，德业股份及曦晨资本跟投。融资将主要用于新一代机器人力传感器产品研发、产能扩充及全球化市场布局。\n\
    \ 从2025年底至今，公司已完成多轮亿元级融资，股东阵容包括红杉中国、宁德时代、智元机器人、银河通用、广汽、上汽、中芯等财务资本与产业资本。\n 蓝点触控成立于2019年，是国内较早一批的力传感器研发企业。其核心团队来自航天科技集团、中科院、北航、西工大等科研机构，团队将航天场景中的高精度力控技术应用到机器人领域。\n\
