- title: 卫宁健康：今年上半年已发布8款AI产品，相关合同订单较2025年明显增长
  description: 卫宁健康近日在2026年半年度报告交流会上表示，公司AI相关收入分为两部分：一是AI原生的WiNEX平台已全面融入AI模型、智能体等基础能力，正在推进全场景智能化转换；二是AI医疗事业部的增量AI产品，2026年上半年已发布8款产品，相关合同订单较2025年有明显增长。同时AI独立项目逐渐增多，以往AI项目多融合在大项目中，现在越来越多客户为AI设置独立预算，市场回报更有保障。目前最受客户认可的AI产品有两款：MedMap（医案智图）、AI重症系统。（证券时报）
