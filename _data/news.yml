- title: 沙特人工智能公司推出中企开发的阿拉伯语大模型
  description: 沙特阿拉伯人工智能公司胡迈因公司9月3日宣布，推出其委托中国人工智能公司开发的前沿阿拉伯语大模型humain-m3。根据胡迈因公司的声明，humain-m3基于中国人工智能公司稀宇科技MiniMax
    M3模型打造，是一个拥有4280亿参数的混合专家模型，并使用超过1万亿个阿拉伯语原生内容词元展开了进一步预训练。在7项公开阿拉伯语基准测试中，humain-m3在参与测试的前沿模型中取得了平均分的最高分，展现出较强的阿拉伯语理解和推理能力。（新华社）
