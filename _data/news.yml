- title: 发改委：发展机器人产业必须因地制宜，防止盲目跟风、一哄而上
  description: 国家发展改革委政策研究室副主任李超在发改委8月份例行发布会上表示，机器人产业涉及人工智能、先进制造、新材料等诸多前沿技术，必须因地制宜，健康有序发展，立足本地的资源禀赋和产业优势，找准定位，发挥优势，防止盲目跟风、一哄而上，切实推动相关行业行稳致远。（证券时报）
  url: https://36kr.com/newsflashes/3958573048183942?f=rss
