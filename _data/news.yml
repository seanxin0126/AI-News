- title: OpenAI对抗Anthropic的最新举措：承诺不留存客户数据
  description: OpenAI承诺不会留存使用其人工智能模型的企业客户数据，同时提升产品安全能力，意在从竞争对手Anthropic手中抢夺客户。不少企业对Claude的开发方保存自身业务数据的做法感到不满。ChatGPT开发商于周三表示，已向部分客户开放新技术预览。该技术能够跨多轮模型交互行为识别行为模式与安全风险。以往AI安全系统只能对单条交互记录逐一监测，若不留存部分客户数据，就很难保障工具得到合规使用；新方案旨在突破这一局限。（新浪财经）
  url: https://36kr.com/newsflashes/3947406491450502?f=rss
