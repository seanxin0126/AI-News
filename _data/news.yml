- title: 摩尔线程：公司已打通具身智能完整链路
  description: 摩尔线程在9月3日召开的2026年半年度业绩说明会上介绍，公司已经打通具身智能从合成数据生成、大模型训练、仿真验证到端侧硬件部署完整链路。MT
    Lambda是全栈具身智能仿真平台，公司还开源了基于MUSA架构的GPU加速物理仿真后端MuJoCo Warp MUSA，并完成四足机器狗和两足人形机器人Sim2Real真机验证。公司在无锡设立工业具身智能创新中心，联合生态伙伴共建；同时与国家具身智能应用中试基地成立“具身智能算力与仿真联合实验室”。具身智能需要AI计算、物理仿真、图形渲染和端侧推理协同，正好体现了全功能…
