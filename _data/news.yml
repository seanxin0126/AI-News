- title: 英伟达将支付60亿美元以获得Poolside AI模型授权 并拟吸纳其员工
  description: "知情人士称，英伟达已同意支付60亿美元，以获得Poolside人工智能（AI）模型的使用许可，并将向100多名员工发出聘用邀请。因相关讨论非公开而要求匿名的知情人士称，这家初创企业还获得英伟达额外10亿美元投资，投前估值为120亿美元。知情人士称，Poolside将继续独立运营。\r\
    \n知情人士称，现有投资者将从英伟达提供的资金中获得一笔款项。英伟达和Poolside的代表均未立即回应置评请求。科技资讯简报Newcomer最先报道了这一消息。英伟达正在向人工智能行业投入大量资金，这笔交易是其中最新一笔。作为AI处理器…"
  url: https://www.cnbeta.com.tw/articles/tech/1574430.htm
