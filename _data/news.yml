- title: 以 AI 赋能名中医传承教育：韩学杰传承工作室与传神素问在京签约
  description: "名老中医毕生积累的学术思想与临证经验，如何借助数智技术实现“可学、可传、可续”？2026年8月4日，传神素问（武汉）数智科技有限公司（以下简称“传神素问”）与韩学杰传承工作室在京举行战略合作签约仪式，双方将依托中医大模型与数字孪生技术，共建“中医九法五径智能传承模型”，探索名医学术思想数智化传承的新范式。韩学杰教授出席签约仪式并见证签约。\n\
