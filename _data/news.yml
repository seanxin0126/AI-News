- title: 亚马逊委任银行筹备首次英镑债券发行
  description: 亚马逊公司已委任银行安排其首次英镑债券发行，交易预计最快于周三启动。据一位不愿具名的知情人士透露，亚马逊计划发行多个期限的债券，期限从3年至19年不等，摩根大通、巴克莱、汇丰控股和Natwest
    Group Plc将负责经办此次发行。亚马逊计划今年投入2,200亿美元资本支出，首席执行官Andy Jassy表示，其中大部分将用于人工智能。（新浪财经）
  url: https://36kr.com/newsflashes/3974568088269063?f=rss
  source: 36kr.com
- title: Anthropic与OpenAI的投行团队推动两家公司IPO后争取获得顶级信用评级
  description: Anthropic与OpenAI的投行顾问正游说相关机构，希望两家企业在即将到来的首次公开募股（IPO）之后获得投资级信用评级。该评级将降低两家公司宏大AI基础设施建设计划的借贷成本。知情人士透露，近几周，摩根士丹利与高盛代表这两家头部AI实验室，已与信用评级机构展开沟通，目标是上市后能够接入规模达11.7万亿美元的公司债券市场。评级机构分析师表示，代表Anthropic和OpenAI的投行提出，两家公司完成上市后将释放巨量流动性，并改善资产负债表状况。（新浪财经）
  url: https://36kr.com/newsflashes/3974376209936644?f=rss
  source: 36kr.com
- title: 国际铜价创新高，绩优低PE铜产业股揭晓
  description: 由于市场看好电网建设、人工智能以及数据中心建设对金属铜的需求前景，今年以来，LME（伦敦金属交易所）铜价格持续走高。9月8日，LME铜价盘中触及14624美元/吨，再创历史新高。东方证券研报认为，铜板块有望迎来盈利上修和估值修复的双重共振。A股市场上，共有25家上市公司涉及铜产业链，主业与铜矿、铜合金、铜加工等相关。2026年上半年，共有19只铜产业股净利润同比增长超过15%（含扭亏为盈）。
  url: https://36kr.com/newsflashes/3975394244571399?f=rss
  source: 36kr.com
- title: Arm数据中心CPU芯片的中国客户名单披露
  description: 今年3月，Arm首次推出实体CPU芯片，当时只透露北美主要云服务厂商是首批客户。在刚刚举行的Arm Everywhere China大会上，这款CPU芯片的中国客户名单出炉：联想集团、字节跳动旗下云计算业务平台火山引擎、新紫光集团均在列。据悉，火山引擎计划将首批基于Arm
    AGI CPU的智能体沙箱解决方案推向市场。新紫光集团和Arm计划在中国成立联合通用人工智能创新中心，围绕AI智能体编排、CXL内存池化、机架级系统架构及边缘AI等方向开展合作创新。（21财经）
  url: https://36kr.com/newsflashes/3974563095228673?f=rss
  source: 36kr.com
