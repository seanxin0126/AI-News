- title: 大额BD交易“扮靓”上半年成绩单，AI制药行业迈向商业价值兑现
  description: 2026年上半年，AI制药行业景气度显著提升，商业化进程明显加快。港股AI制药“三小龙”上半年业绩整体向好：英矽智能扭亏为盈；剂泰科技营收大幅增长、经调整净亏损显著收窄；晶泰科技AI4S（科学智能）业务大幅增长。另据Choice数据，截至8月30日，已公布半年度业绩的73家A股AI制药（医疗）概念股中，超过五成公司净利润实现同比增长，AI制药行业加速从技术探索迈向商业价值兑现。从半年报来看，AI制药行业景气度显著提升，其中大额BD（商务拓展）频现成为上市公司业绩增长的重要驱动力。（上证报）
