- title: 投资方预计Anthropic将于10月挂牌上市，估值有望达2万亿美元
  description: 投资方预计，人工智能初创企业Anthropic将于10月挂牌上市，估值达到2万亿美元乃至更高。这一惊人估值将超越SpaceX，让这家AI实验室创下史上规模最大的首次公开募股纪录。六位该公司投资方透露，凭借营收迅猛攀升，Anthropic计划于今年秋季上市，估值较当前水平有望翻一倍以上。倘若以此估值完成上市，这家成立五年的企业早期投资方将斩获数十亿美元收益。（财联社）
