- title: 7亿元A轮融资之后，栖息地想把「家」带到哪里？
  description: "8月20日，智能住宅品牌栖息地宣布完成7亿元A轮融资，由常州新北区科创基金领投。这也是近三年中国一级市场大家居产业规模最大的一笔融资。此前，栖息地曾于2024年完成6.53亿元首轮融资。\n\
    \ 几乎同时，2026年世界人形机器人运动会提供了一个观察切面：组委会增加了家庭场景赛，需要一个足够真实、又能为不同城市参赛队伍提供统一条件的家庭环境。几经周折，最终选择栖息地的北京体验中心作为家庭场景的唯一场地提供方。\n\
    \ 这套场地采用的，正是栖息地在全国多个城市日常交付的产品标准。栖息地创始人沈亚楠这样形容，“把场地买了，搬进去…"
