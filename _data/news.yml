- title: OpenAI将终止向Cursor提供模型服务，马斯克回应
  description: '据多家外媒报道，当地时间28日，美国开放人工智能研究中心（OpenAI）宣布，计划停止向美国太空探索技术公司（SpaceX）旗下AI编程平台——“光标”代码编辑器（Cursor）提供模型服务。OpenAI在社交媒体上发文称，已通知SpaceX，拟定终止日期为2026年11月12日。OpenAI表示，作出该决定是基于“过往经验”。因为马斯克旗下多家公司曾出现违约行为，无法确信SpaceX会在服务条款框架内使用技术。

    对此，马斯克在X平台回应称“毫不在意”，并称OpenAI首席执行官阿尔特曼和总裁布罗克曼“两人完全不…'
  url: https://36kr.com/newsflashes/3961329190813059?f=rss
