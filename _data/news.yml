- title: 海致科技获纳入港交所科技100指数成份股
  description: 近日，海致科技宣布，公司获纳入香港交易所科技100指数成份股。相关变动将于9月11日收市后实施，并于9月14日起正式生效。本次调整为指数优化编制方案后的首次季度调样，重点扩大了对新兴科技趋势的覆盖，包括人工智能（AI）产业链的相关机遇。此前公司披露的半年报显示，上半年公司营收达2.96亿元，同比增长70.4%；整体毛利率提升至44.7%。
