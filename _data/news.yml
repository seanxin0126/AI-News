- title: 若愚科技携机器人大脑“若愚九天”亮相能源产业核心圈
  description: 8月12日，2026能源行业科技创新融合发展大会在北京举行。大会汇聚中国石油、中国石化、中国海油、中国华能、华为、中国移动及若愚科技等特种场景能源产业链上下游核心力量。若愚科技携自主研发的若愚九天机器人大脑、能源高危场景具身智能大脑系统解决方案参会。创始人兼CEO孙腾发表主题演讲，详解该机器人大脑如何为特种场景机器人提供核心智能，使其具备进入真实特种场景工作的能力。
