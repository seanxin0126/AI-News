- title: 韩国政府拟首次直接采用民营数据中心GPU服务
  description: 韩国政府将首次直接获得外部民营人工智能数据中心（AIDC）的图形处理器（GPU）服务。在长期以安全为由坚持封闭原则的公共基础设施政策面前，这被认为是政府在确保国家AI竞争力这一现实需求下作出的政策转变。韩国行政安全部国家信息资源管理院大邱中心为确保高性能AI计算资源，将采用通过专线连接三星SDS东滩数据中心GPU服务的方式。（新浪财经）
