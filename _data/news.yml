- title: AIGC长剧点燃AI应用投资热度，公募AI投资转向商业兑现
  description: 下半年，AI算力硬件的投资热潮逐步退潮，公募基金对AI产业的投资重心正从上游技术底座向下游应用端迁移。特别是随着国内首部AIGC（生成式人工智能）长剧《后西游记》热播引爆市场，公募基金正把AI投资视线从火热的算力硬件，转向具备商业化落地能力的下游AI应用。基金经理正抛弃单纯故事叙事，改用年化经常性收入（ARR）、现金流、财报数据筛选标的，AI产业投资迎来从概念炒作到商业验证的关键转折。（证券时报）
