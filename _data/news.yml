- title: 英伟达洽谈向穆拉蒂旗下思维机器实验室投资约25亿美元
  description: 现有投资方安德森‑霍洛维茨（a16z）向其他潜在投资者透露，由前OpenAI首席技术官米拉・穆拉蒂执掌的AI企业思维机器实验室（Thinking
    Machines Lab）正在洽谈新一轮融资，计划募资50‑60亿美元，投前估值至少400亿美元。这家在思维机器实验室拥有董事会席位的投资机构表示，预计英伟达将出资约一半，也就是25亿美元。这是英伟达系列交易的延续，借此扩大自身在开源AI开发者群体中的影响力，此前英伟达已经斥资129亿美元收购开源模型平台Hugging
    Face。（新浪财经）
