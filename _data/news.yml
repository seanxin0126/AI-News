- title: 高盛大幅上调AI服务器PCB和CCL预测，2028年市场规模将达840亿和480亿美元
  description: 高盛在最新发布的全球印刷电路板（PCB）和覆铜板（CCL）行业报告中，大幅上调人工智能（AI）服务器相关市场规模预测。该行预计，全球AI服务器PCB市场将在2027年达到375亿美元，较此前预测上调38%，2028年进一步增至840亿美元；CCL市场2027年预计达到221亿美元，上调18%，2028年则有望增至480亿美元。这意味着，2026年至2028年，AI服务器PCB和CCL市场规模的复合年增长率将分别达到148%和161%。（财联社）
