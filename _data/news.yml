- title: Anthropic联合创始人承认人工智能正遭遇信任危机
  description: Anthropic联合创始人兼首席执行官达里奥·阿莫代伊否认公众对人工智能普遍产生的末日感应由他负责，但他承认行业确实存在信任难题。他提到当下存在一种非此即彼的错误认知：一部分人认为监管会造成监管俘获、权力集中；另一部分人则认为广泛分发人工智能模型（包括开源模型）才是约束技术风险的最优路径。阿莫代伊指出，法院这类制度机构可以实现权力去中心化；同时他表示Anthropic支持相关政策：一方面约束前沿AI企业发展速度，另一方面为小型竞争对手创造发展优势。（新浪财经）
