- title: 业绩快报｜“全球空间智能第一股”群核科技AI收入大增177%，9月初有望进入港股通
  description: "8月27日，“全球空间智能第一股”群核科技（00068.HK）发布2026年中期业绩。\n 报告期内，公司实现营业收入4.05亿元，整体毛利率提升至83%，创历史新高；同时，公司经调整净利润达到5542万元，同比增长211%，已接近去年全年水平。\n\
    \ 同日，公司推出3D生成模型 Lux3D，同时启动新一代世界模型产品内测。技术利好带动市场情绪，公司股价收盘上涨 6.97%。\n 业绩发布之外，群核科技9月初还有望进入港股通，有助于拓宽投资者基础，提升股票流动性和市场关注度。日前，公司已入选恒生综合指数成分股，相关调整将…"
