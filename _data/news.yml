- title: 海致科技与京东科技达成战略合作
  description: 近日，北京海致科技集团股份有限公司与京东科技信息技术有限公司正式达成战略合作。双方将深度融合海致图智能核心技术与京东科技产业云底座能力，围绕技术共建、行业赋能等四大维度协同发力，联手打造高可信、可解释的产业AI解决方案，加速AI技术在金融、能源、政务等重点行业的规模化落地。目前，海致科技的Atlas图谱解决方案与Atlas智能体已在政务、金融、能源等核心领域实现规模化落地，服务数百家行业头部客户。
