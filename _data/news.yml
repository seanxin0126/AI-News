- title: 36氪首发 | 布局“视触觉+压阻”组合方案，机器人触觉传感企业完成数千万元融资
  description: "作者 | 乔钰杰\n 编辑 | 袁斯来\n 硬氪获悉，深圳市模量科技有限公司（以下简称“模量科技”）近日完成由猎鹰投资、益华资本投资的数千万元Pre-A轮融资，点石资本担任财务顾问。本轮资金用于研发团队和产线扩建、全球业务拓展。\n\
    \ 随着具身智能进入产业落地阶段，触觉传感器逐渐成为机器人感知能力提升的重要环节。模量科技成立于2024年底，是一家致力于构建触觉基础设施的公司，具备触觉感知模组、触觉数据采集和触觉模型全链路研发能力，聚焦人形机器人/灵巧手、工业智能制造两大赛道。\n\
    \ 此前，模量科技已从触觉材料切入，自主研发高…"
