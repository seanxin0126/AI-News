- title: 宇树科技今年成立两家新公司
  description: 36氪获悉，据媒体报道，8月19日，宇树科技高开629%，报1100元，单签收益为47.46万元，总市值达4449亿元。天眼查App显示，宇树科技股份有限公司成立于2016年8月，注册资本约3.6亿人民币，法定代表人为王兴兴，经营范围包括智能机器人的研发、智能机器人销售、工业机器人制造等，由王兴兴、汉海信息技术（上海）有限公司等共同持股。对外投资信息显示，今年以来，该公司已成立上海拓天智联科技有限公司、杭州宇树星盟科技有限公司。
  url: https://36kr.com/newsflashes/3945862220905603?f=rss
  source: 36kr.com
- title: 韩国上半年风险投资达8.87万亿韩元，创历史同期新高
  description: 韩国政府周三公布的数据显示，在人工智能、机器人等前沿技术投资热度高涨的背景下，2026年上半年韩国对初创企业的投资规模创下历史同期新高。韩国中小企业和初创企业部的数据显示，1‑6月，韩国向发展前景良好的风险企业及初创公司合计投入8.87万亿韩元（约合63.4亿美元），同比增长54.3%，打破了2022年上半年创下的7.64万亿韩元的前纪录。（新浪财经）
  url: https://36kr.com/newsflashes/3946127218670982?f=rss
  source: 36kr.com
