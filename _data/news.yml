- title: 从CPO到OCS，光通信上游材料迎来价值重构
  description: 英伟达宣布全球首款200G/lane共封装光学（CPO）Spectrum-X以太网交换机系统已全面量产；SK海力士日前发布下一代AI光互连CPO技术路线图。业内人士认为，随着CPO交换机规模化落地、OCS全光交换机技术持续推进，光互联产业链价值分配将迎来重构，上游的磷化铟、薄膜铌酸锂、硅光SOI晶圆等材料将迎来强劲需求和发展机遇。
    当前，光模块上市公司纷纷将业务布局向上游材料延伸；材料类上市公司正在布局磷化铟、红磷等电子材料领域，并获得市场重新估值。 (上海证券报)
