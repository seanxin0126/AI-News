- title: 硬氪独家 | 清华，中科院具身大脑企业融资10亿，已获得数亿海外订单
  description: "硬氪获悉，近日具身智能企业中科第五纪连续完成A1轮、A2轮融资，总融资金额超过十亿元。其中A1轮由锡高投、中国银行旗下中银AIC基金、三锋投资联合投资；A2轮由芯能创投、中银AIC基金、中山创投、鸿瑞达投资、博彦科技、金创投(浙江省新能源汽车子基金)联合投资。\n\
