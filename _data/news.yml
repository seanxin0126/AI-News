- title: 上交所发布上证科创板人工智能应用臻选指数
  description: 36氪获悉，上海证券交易所和中证指数有限公司将于2026年9月2日正式发布上证科创板人工智能应用臻选指数，为市场提供更丰富的投资标的。上证科创板人工智能应用臻选指数从科创板市场中选取业务涉及AI应用软件和硬件的上市公司证券作为指数样本，以反映科创板市场AI应用领域上市公司证券的整体表现。
