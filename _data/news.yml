- title: 知名基金经理最新调仓路径曝光，科技调仓呈现多空分歧
  description: 近日，随着上市公司因回购等事项密集披露最新的前十大流通股东名单，公募基金自三季度以来的调仓动态随之曝光。面对7月份以来市场的剧烈震荡与风格轮动，多位知名基金经理对旗下组合进行了调整。整体来看，在以AI、半导体为代表的科技板块经历较深回调的背景下，公募基金在硬科技赛道的操作上显现出明显的多空分歧，部分产品选择逆势“越跌越买”，亦有部分产品进行了主动降仓。与此同时，部分以灵活择时见长的偏价值风格产品，通过向传统行业龙头切换，成功实现了净值的防御避险。（证券时报）
