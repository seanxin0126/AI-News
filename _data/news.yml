- title: 36氪2024年度中国最具影响力产业投资暨十大领域年度名册｜正式发布
  description: "向内求。\r\n\n \n \n 出品｜36氪创投研究院\n 2024年，全球经济格局正在经历深刻调整，世界产业链的格局也在急剧转变中。在环境变革的持续影响下，中国风险投资乃至整个金融市场，都处在一个漫长的调整期。\n\
