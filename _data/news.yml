- title: A50直线拉升涨超1%，外围传来三大利好
  description: 周五（8月21日）早盘，A50直线拉升，A股主要股指亦集体反弹，CPO、液冷等与AI相关的板块大幅走强。与此同时，韩国股指由跌转涨，显著冲高。而日本股市的跌幅也显著收窄。外围市场传来三大利好。首先，市场担心的美债收益率在亚太市场开盘之后，一度全线杀跌，美国国债市场预期的变化也打开了弱美元的＂魔盒＂，利于权益估值演绎；其次，韩国交易所启动Sidecar机制，暂停KOSDAQ程序化卖盘；最后，存储亦迎来大利好。美光科技表示，人工智能已从根本上改变存储产业的周期性，这个产业过去一直深陷景气繁荣与衰退循环。（券商中国）
  url: https://36kr.com/newsflashes/3948766906416514?f=rss
  source: 36kr.com
- title: 博通据悉寻求逾600亿美元债务融资，助力Anthropic等获取AI算力
  description: 据知情人士透露，博通（Broadcom）正与一组贷款机构洽谈，计划筹集逾600亿美元债务资金，用于一项将惠及Anthropic PBC等公司的AI芯片融资交易。部分知情人士表示，这笔融资方案仍在敲定中，还可能包括约300亿美元的次级债务。因讨论未公开消息，知情人士要求匿名。部分知情人士称，根据拟议方案，博通将为规模约600亿至700亿美元的优先担保债务提供部分担保。按目前讨论的方案计算，融资总规模最高可达1000亿美元。（新浪财经）
  url: https://36kr.com/newsflashes/3948517016878215?f=rss
