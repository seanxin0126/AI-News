  description: 36氪获悉，工业和信息化部办公厅印发《人工智能中小企业创业支持计划（2026-2028年）》的通知。推进开源创业生态建设。支持国家级人工智能开源社区（AtomGit）发展壮大，加强面向人工智能创业企业的优质开源资源供给和服务支撑。鼓励人工智能创业企业积极参与开源生态建设，贡献开源模型、工具、数据集等资源，营造开放协同、共建共享的良好生态。加强开源模型、工具和数据集应用推广。引导人工智能创业企业根据实际需求，合理应用优质开源基础模型、开发框架、工具链和开源数据集等资源，降低技术研发和产品创新成本。
