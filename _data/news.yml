- title: Alphabet市值蒸发逾7000亿美元，投资者对其人工智能业务优势打下问号
  description: 过去一年大部分时间里，Alphabet Inc．一直是大型科技股中表现最强劲的公司之一，投资者押注其将成为人工智能热潮的最大赢家之一。该公司股价在截至5月13日的12个月累计上涨逾150%，并于当天创下历史新高，在同期标普500指数成分股中跻身表现最好的25家公司之列，远远跑赢其他“科技七巨头”。但此后势头发生逆转。市场开始担心这家谷歌母公司出现人才流失，同时质疑其在AI领域是否正在失去领先优势。Alphabet股价目前较峰值下跌约15%，市值蒸发逾7000亿美元，并成为这段时间拖累标普500指数点位最多的个股。…
