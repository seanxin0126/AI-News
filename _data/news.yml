- title: 众擎机器人等在上海成立新公司，注册资本6120万
  description: 36氪获悉，天眼查App显示，上海星意擎坤科技有限公司于8月12日成立，注册资本6120万元人民币，法定代表人为吕学敏，经营范围含智能机器人的研发、智能机器人销售、工业机器人销售、人工智能基础软件开发、人工智能理论与算法软件开发等。股东信息显示，该公司由北京火星人视野科技有限公司持股约43.81%，上海傲意信息科技有限公司持股约32.68%，深圳众擎机器人科技股份有限公司持股约19.59%，上海坤亦商科技有限公司持股约3.92%，企业类型为有限责任公司（外商投资企业与内资合资）。
