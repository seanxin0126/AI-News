- title: 硬氪专访丨公司退市、裁员10万人，前掌门教育CEO创业家庭机器人，获10亿融资
  description: "作者 | 邱晓芬\n 编辑 | 袁斯来\n 直到现在，未来不远的创始人张翼还会偶尔想起5年前地中海海边，那群发呆的海鸥。\n 他刚经历了普通人难以想象的大起大落。2021年6月，张翼创办的“掌门教育”登陆纽交所。上市首日，公司的市值一度冲破30亿美金。春风得意之时，这家在线教育公司在全国有十万名员工、六七万名老师，服务超过100万个家庭。\n\
    \ 当时的张翼只有31岁。\n 转折点发生在48天后。 “双减”靴子落地，中国在线教育行业几乎一夜归零。三个月内，“掌门教育”一口气裁掉了10万名员工。一年内，公司又启动了退市程序。\n\
    \ …"
