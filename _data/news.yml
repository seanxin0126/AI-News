- title: AI热潮催生亿万富翁财富增长
  description: 据美国《财富》杂志网站近日报道，财富情报公司Altrata的最新报告显示，2025年全球亿万富翁人数达3795人，创下历史新高；亿万富翁总财富额同比增长12.8%，达到15.1万亿美元，同样刷新纪录，这一数字接近美国标普500指数成分股总市值的四分之一。在这些亿万富翁中，资产超过500亿美元的有29人，包括拉里·佩奇、埃隆·马斯克和杰夫·贝索斯等。具体来看，AI投资热潮是亿万富翁财富增长的主要驱动力，不少科技领域的富翁身家随企业人工智能业务扩张大幅增值。（央视财经）
