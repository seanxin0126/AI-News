- title: AI需求推动，韩国上市公司上半年合并营业利润同比飙升近350%
  description: 周三公布的数据显示，今年上半年，韩国上市企业实现了创纪录的盈利，主要受全球对人工智能所用半导体的旺盛需求拉动。根据韩国交易所发布的数据，在1月至6月期间，韩国综合股价指数成分股上市公司720家企业的合并营业利润同比增长348.5%，达到275万亿韩元（约合1952亿美元）。其合并营收同比增长34.5%，达1070万亿韩元，净利润则飙升330%，达到2915万亿韩元。（新浪财经）
  url: https://36kr.com/newsflashes/3946029412105350?f=rss
  source: 36kr.com
- title: 奇瑞汽车等入股蔚来旗下蔚聚科技，后者增资至7.25亿
  description: 36氪获悉，天眼查App显示，近日，蔚聚科技（安徽）有限公司发生工商变更，新增奇瑞汽车股份有限公司、合肥合锻智能制造股份有限公司等为股东，同时，注册资本由约3.7亿人民币增至7.25亿人民币，增幅约94%。该公司成立于2023年4月，法定代表人为曲玉，经营范围包括新兴能源技术研发、新材料技术研发、工业工程设计服务等，现由蔚来控股有限公司及上述新增股东共同持股。
