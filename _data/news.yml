- title: 西班牙光交换公司iPronics完成1.25亿美元B轮融资，英伟达参投
  description: 西班牙瓦伦西亚的硅光公司iPronics周三宣布完成1.25亿美元B轮融资，由Maverick Silicon与Light Street
    Capital共同领投，英伟达参与。本轮融资完成后，公司累计融资额升至1.77亿美元。资金将用于扩大运营、加快商用部署，并满足其机架式光交换机产品Optical
    Networking Engine（ONE）在人工智能数据中心的需求。（新浪财经）
