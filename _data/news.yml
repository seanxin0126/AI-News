- title: OpenAI广告业务爆发式增长，年化营收达到10亿美元
  description: OpenAI于周一宣布，其广告业务年化营收已经达到10亿美元，公司称这一里程碑印证了自身“多元化商业模式”的可行性。这家人工智能企业正筹备规模预计十分庞大的首次公开募股（IPO），同时面临向投资者证明其8520亿美元估值合理性的压力。OpenAI表示，该广告业务上线约200天，是在企业服务、个人订阅、按调用量计费的API接口等现有营收支柱之上拓展而来。（新浪财经）
