- title: 词元消耗量爆发式增长，银行AI应用全面落地
  description: 随着AI在银行经营全链条中的嵌入日益加深，Token（词元）消耗量正成为彰显AI应用规模与活跃度的关键量化指标，出现在上市银行的半年报中。
    从工商银行、招商银行、平安银行等披露的数据来看，银行业AI应用已从技术探索走向全面落地。随着应用场景的向实入深，Token消耗量呈爆发式增长，反映大模型已从“试点尝鲜”进入“高频生产使用”阶段。（上证报）
