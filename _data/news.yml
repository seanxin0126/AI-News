- title: 上海：加速L3级有条件自动驾驶、L4级高度自动驾驶量产
  description: 36氪获悉，上海印发《上海市加快推进新型工业化构建现代化产业体系“十五五”规划》。规划提出，推动整车智造转型升级，强化整车龙头企业本地研发，聚焦自动驾驶、动力电池创新，深化全栈技术自主可控，丰富高端产品供给。加快智能网联创新应用，深化自动驾驶实训场建设，实现L2级组合辅助驾驶新车全覆盖，加速L3级有条件自动驾驶、L4级高度自动驾驶量产。稳步推进智能公交、智能重卡、智能出租等自动驾驶创新应用示范，推进无人驾驶特种作业车应用。推动“三电”（电池、电驱、电控）领域协同突破，布局新一代动力电池研发和量产线，抢占转型新赛道。
  url: https://36kr.com/newsflashes/3953359650618758?f=rss
  source: 36kr.com
