- title: 达实智能澄清：不持有宇树科技股份，无机器人业务
  description: 达实智能开盘后快速拉升封死涨停，截至13时22分，报3.88元/股，涨停板上封单资金达3.21亿元。推动本轮股价异动的导火索，或是市场流传的一则传闻。近期有市场传言称，达实智能间接持有宇树科技0.04%的股份。对此，记者以投资者身份致电达实智能证券部，工作人员明确表示，无论直接持股还是间接持股，达实智能均不持有宇树科技股份，同时公司现阶段不存在机器人相关研发、生产与制造业务。对于当日股价涨停，公司重申不存在应披露而尚未披露的重大事项。（21财经）
