- title: 博通预计AI芯片营收未来两年飙升，股价盘后止跌企稳
  description: 博通预计未来两年人工智能（AI）芯片营收将大幅增长，重新提振了投资者对于这家半导体巨头挑战英伟达的信心。博通首席执行官陈福阳在财报电话会议上表示，AI芯片营收预计将在2027财年增加一倍，达到约1150亿美元，2028财年进一步升至2300亿美元。该公司2028财年每股收益也有望超过30美元，高于华尔街预期。博通股价盘后随之止跌企稳。（新浪财经）
  url: https://36kr.com/newsflashes/3966881625660934?f=rss
  source: 36kr.com
- title: Equinix将携手英伟达、Together AI推出人工智能推理交换平台
  description: Equinix发布分布式人工智能推理框架Equinix Inference Exchange，整合英伟达企业参考架构、Together
    AI开源模型平台以及Equinix全球数据中心基础设施。Equinix负责提供基础设施、电力、冷却以及Fabric网络连接。英伟达提供企业参考架构以及专为推理场景打造的人工智能算力。Together
    AI提供推理平台，支持200余款开源模型。Equinix Inference Exchange将于2027年第一季度正式上线。（新浪财经）
  url: https://36kr.com/newsflashes/3966229129125125?f=rss
  source: 36kr.com
- title: 普华永道预计到2050年全球数据中心累计投资将达到31.6万亿美元
  description: 普华永道预计，为满足全球不断增长的人工智能(AI)需求，到2050年全球数据中心累计支出将达到31.6万亿美元，投资规模将超过铁路、互联网和电气化等历史性基础设施建设浪潮。普华永道周三发布报告称，如果AI普及速度超过其“基准情景”预期，未来约25年的数据中心支出甚至可能达到50万亿美元。相比之下，美国国内生产总值(GDP)目前约为30万亿美元。随着消费者、企业和政府越来越多地使用AI，微软、亚马逊等科技巨头以及规模较小的数据中心运营商正快速在全球建设新的算力设施。大部分投资将用于数据中心的内部设备，包括AI芯片、…
