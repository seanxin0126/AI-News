- title: 高盛：全球AI投资今年将突破10000亿美元 美国投资接近6000亿美元
  description: 财联社8月10日电，近日，高盛分析师发布报告称，预计到2026年底，全球人工智能投资将超过1万亿美元，其中美国人工智能投资预计接近6000亿美元。高盛研究部根据其对人工智能投资的偏好估计值，推算出到2028年人工智能投资占美国
    GDP 的比重。据高盛估算，美国人工智能资本支出占GDP的比重将从2026 的1.8%上升到 2027 年的2.5%，并在2028年进一步上升到 2.8%。而与此同时，全球人工智能投资占全球GDP的比重，将在2026年至2028年逐年上升，分别为0.9%、1.3%和1.4%。（财联社）
  url: https://36kr.com/newsflashes/3933273714179457?f=rss
  source: 36kr.com
- title: 近40亿元融资背后：资本为何看好帕西尼
  description: "过去两年，大模型提升了机器人理解任务、拆解指令和规划动作的能力，视觉模型也让机器更擅长识别物体和判断空间位置。但机器人真正伸手之后，问题会迅速从“看见了什么”转向“接触之后发生了什么”。机械手把线束插进接口，视觉系统已经确认位置无误，动作仍可能失败：插入力突然增大、零件发生偏转，或者材料开始滑移。对人来说，这些判断由指尖本能完成；对机器人来说，则依赖触觉感知和控制闭环。\n\
    \ 这也是触觉在当前具身智能产业阶段进入“聚光灯”的原因。\n 就在行业从样机竞赛走向交付竞赛的节点，帕西尼完成新一轮10亿元融资，累计融资近40亿…"
