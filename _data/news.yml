- title: Verizon与Google达成逾10亿美元合作 将为其数据中心提供暗光纤连接
  description: "美国电信巨头威瑞森（Verizon Communications）于周五宣布，已与Google母公司 Alphabet 签署了一项价值超过10亿美元的暗光纤基础设施协议，将为Google推进人工智能数据中心建设提供网络连接支持。\r\
