  description: 36氪获悉，企查查App显示，近日，中广核新能源（楚雄）有限公司成立，法定代表人为普智勇，注册资本为1亿元，经营范围包含：风力发电技术服务；太阳能发电技术服务；储能技术服务；生物质燃料加工；生物质成型燃料销售等。企查查股权穿透显示，该公司由中广核风电有限公司旗下中广核云南新能源有限公司等共同持股。
