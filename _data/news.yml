- title: OpenAI态度大转变 主动呼吁加州强化人工智能监管法案
  description: "ChatGPT母公司OpenAI近日对其总部所在地加州的标志性人工智能（AI）法案提出“强化”呼吁。这一举动标志着该公司立场的重大转变——在旗下AI模型近期发生自主黑客攻击事件后，这家曾经强烈反对实施更严苛规则的科技巨头，如今成为了首家主动呼吁修改透明度法案的主要AI实验室。\r\
    \nOpenAI表示，公司致力于就此问题与加州立法机构及州长展开合作。公司在一份声明中强调：“近期的事件突显了实施这些保护措施的必要性，同时也表明随着全行业不断涌现新的风险，及时更新法案至关重要。”目前，加州州长加文·纽森（Gavin\
    \ New…"
