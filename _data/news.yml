- title: 国家邮政局：“人工智能+”赋能邮政，无人机无人车加速落地
  description: 国家邮政局新闻发言人胡凯表示，“十五五”时期，国家邮政局将深入实施创新驱动发展战略，加强人工智能方向技术研发中心建设，统筹发展和安全，协同国家有关部门不断完善相关政策法规标准，拓展应用场景，培育发展行业新质生产力。不仅是“天上飞”“地上跑”的硬件升级，《邮政业发展“十五五”规划》还要求普及应用一批智能终端和智能体，提高全程智能监控和调度水平。同时挖掘行业数据在监测消费需求变化、物流通畅情况、经济发展状况等方面的价值，更好地服务政府决策、生产运营、市场监测、指挥调度。（央视新闻）
