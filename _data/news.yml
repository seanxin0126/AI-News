- title: 国家统计局：1—7月份以算力芯片、存储芯片为代表的集成电路行业利润同比增长18.5倍
  description: 国家统计局工业司首席统计师于卫宁表示，随着“人工智能+”加快拓展、算力需求持续扩张，相关产品需求增加拉动价格上涨，带动与人工智能生产和应用相关的电子行业利润高速增长。1—7月份，电子行业利润同比增长1.1倍，拉动全部规模以上工业企业利润增长9.3个百分点，是规模以上工业企业利润较快增长的主要支撑。其中，以算力芯片、存储芯片为代表的集成电路行业利润同比增长18.5倍，对全部电子行业利润增长贡献率超过八成。其他相关行业中，与计算机、服务器相关的计算机整机制造、计算机外围设备制造、工业控制计算机及系统制造行业利润分别增…
