- title: 优必选在乐山成立新公司，注册资本5000万
  description: 36氪获悉，天眼查App显示，优必选（乐山）机器人科技有限公司近日成立，法定代表人为王琳，注册资本5000万人民币。公司所属行业为科技推广和应用服务业，经营范围含智能机器人的研发、人工智能基础软件开发、人工智能应用软件开发、人工智能行业应用系统集成服务、人工智能公共服务平台技术咨询服务、软件开发等。股东信息显示，该公司由深圳市优必选科技股份有限公司全资持股，认缴出资5000万元人民币，企业类型为有限责任公司（外商投资企业法人独资）。
  url: https://36kr.com/newsflashes/3943234564930945?f=rss
  source: 36kr.com
- title: 软银向建筑机器人公司Gravis Robotics投资2亿美元
  description: 8月17日，Gravis Robotics宣布完成2亿美元A轮融资，由软银投资。公司称，这是建筑机器人领域规模最大的A轮融资，将用于推进重型工程机械自动化，并在全球建筑工地扩大部署。Gravis
    Robotics成立于2022年，由苏黎世联邦理工学院孵化，主要开发用于挖掘机等重型工程机械的人工智能系统。（界面）
  url: https://36kr.com/newsflashes/3944217400393088?f=rss
