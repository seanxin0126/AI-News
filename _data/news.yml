- title: 何小鹏：目标在明年实现Robotaxi无安全员载客运营；组建BD团队加速物理AI商业化
  description: 8月24日，何小鹏透露，搭载第二代VLA的前装量产Robotaxi已在广州完成超2000次内测订单，跑通载人示范运营的全流程。公司已完成云端接管的平台开发，目标在明年实现无安全员的载客运营。为了加速物理AI技术的商业化，小鹏近期组建集团级的BD团队，正与海外和国内的合作伙伴积极洽谈，让图灵AI芯片、第二代VLA模型、Robotaxi和人形机器人技术更快走向全球市场。（证券时报）
