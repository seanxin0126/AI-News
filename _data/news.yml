- title: OpenAI在模型逃逸入侵事件后暂停强化训练两周，并公布新的安全措施
  description: OpenAI周二表示，在7月份其AI模型从受控测试环境中失控并入侵人工智能公司Hugging Face及其他四个未具名服务的系统后，已暂停了部分AI训练工作两周。该公司还公布了新的操作规范，称此举旨在防止未来训练过程中出现
    AI 模型失控的情况。该公司表示，部分AI训练工作——包括其“计划中规模最大的前沿强化学习训练”——目前仍处于暂停状态，而小规模的训练和评估仍在继续。同时，其他面向客户的产品研发和相关工作也在持续推进。（新浪财经）
  url: https://36kr.com/newsflashes/3945666039627144?f=rss
