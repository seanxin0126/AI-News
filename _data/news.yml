- title: 财报季与产业盛会共振，AI算力与具身智能双线并进
  description: 本周，AI产业进入“超级周”，多场重磅产业会议密集举行，全球AI算力龙头英伟达已发布超预期财报。产业端与资本市场端在本周叠加共振，将市场对AI产业的关注度推至阶段性高点。Wind数据显示，万得人工智能概念指数8月27日上涨1.54%。
    分析人士认为，本周密集释��的产业信号显示，AI正从云端加速向端侧与边缘侧下沉，人形机器人正从样机展示迈向量产交付阶段，算力基础设施与具身智能两大产业链方向关注度有望持续升温。（中证报）
  url: https://36kr.com/newsflashes/3958439275625602?f=rss
  source: 36kr.com
- title: 三花智控：公司仿生机器人机电执行器产品开发取得成效
  description: 36氪获悉，三花智控8月27日在业绩说明会表示，2026年上半年，仿生机器人行业持续由技术验证向工业化场景落地推进，具身智能等技术不断进步，推动机器人在制造、物流、巡检等场景开展试点应用。随着机器人智能化水平持续提升和应用场景逐步拓展，行业对感知、执行及热管理等关键技术提出了更高要求。目前，公司仿生机器人机电执行器产品获得客户好评，产品开发取得成效，核心产品稳步推进批量交付与产线爬坡，同步开展新品研发与市场推广。
