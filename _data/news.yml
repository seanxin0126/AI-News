- title: 中芯国际赵海军：二季度晶圆平均销售单价环比提升5.7%
  description: 8月14日上午，中芯国际联合CEO赵海军在二季度业绩会上介绍，二季度，公司晶圆量价齐升，单季收入突破三十亿美元，各项核心经营数据同比与环比均实现了大幅增长。其中，出货量环比增加了14.4%，晶圆平均销售单价环比提升了5.7%；出货量的增加主要源于人工智能对配套芯片需求的激增与客户的提拉出货。当季公司新增晶圆8千片折合12英寸月产能；产能利用率为93.7%，环比增长0.6个百分点。（证券时报）
