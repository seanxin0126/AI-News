- title: 亚马逊与瑞典四座风力发电场达成电力供应协议
  description: 亚马逊公司宣布签署了长期协议，从瑞典的四个风力发电场购买电力，以帮助满足其在北欧国家数据中心扩容期间的电力需求。这些交易将新增近200兆瓦的电力，亚马逊表示，一旦全面运营，其在瑞典的电力供应将超过1吉瓦。随着云计算和人工智能服务需求的增长，亚马逊和其他超大规模数据中心运营商正在加大电力采购力度，并投资扩建自身数据中心。这家电商巨头计划在2027年和2028年为其数据中心新增200万个英伟达GPU，此前该公司曾表示今年将开始部署100万个。（新浪财经）
