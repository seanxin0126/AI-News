- title: 李泽湘孵化的睡眠AI硬件公司获新融资，深高新投领投数千万元｜硬氪首发
  description: "作者｜黄楠\n 编辑｜袁斯来\n 硬氪获悉，睡眠AI硬件公司「灵络科技」近日完成数千万元天使轮融资，本轮由深高新投领投，老股东合鼎共资本持续加注。融资资金将主要用于核心技术迭代打磨，完善整套配套软硬件体系，并加速商业化落地与市场拓展，推进产品的规模化量产与交付。势能资本长期担任公司独家财务顾问。\n\
