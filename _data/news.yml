- title: 众筹超千万美金，桌面CNC品牌完成数亿元天使轮系列融资，红杉、蓝驰等押注｜产品观察
  description: "作者｜黄楠\n 编辑｜袁斯来\n 智能硬件赛道融资遇冷时，一家CNC公司却拿下了头部机构的数亿融资。\n 硬氪独家获悉，桌面CNC品牌巢匠科技NestWorks（以下简称NestWorks）日前已完成数亿元天使轮及天使+轮融资，投资方为红杉中国、蓝驰创投、钟鼎资本、祥峰投资与元璟资本，高鹄资本担任后续融资的独家财务顾问。\n\
    \ 作为大象机器人内部孵化的新品牌，NestWorks于2025年11月正式成立。这家成立超十年的机器人公司曾推出myCobot桌面协作机械臂、metaCat仿生猫等爆品。NestWorks首款产品上线…"
