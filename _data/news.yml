- title: 聚焦电池设计自动化，宁德时代独家亿元投资AI for Science企业“屹艮科技”
  description: 近日，新能源新材料AI for Science（AI4S）企业“屹艮科技”获宁德时代独家亿元级战略融资，系宁德时代在该赛道的首次战略投资。据介绍，屹艮科技构建“物理×AI”的自研算法基座，在电池设计自动化（Battery
