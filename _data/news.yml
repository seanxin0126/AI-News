- title: Hugging Face首席执行官：在129亿美元收购案数周前，公司就已接触英伟达黄仁勋
  description: 芯片厂商英伟达已正式同意以129亿美元收购开源人工智能平台Hugging Face，此举标志英伟达业务跳出硬件范畴，进一步向人工智能软件栈上游延伸。媒体上周就曝出该交易传闻，市场对此早有预期。英伟达首席执行官黄仁勋周四在博文中表示，完成本次收购后，Hugging
    Face“仍将是面向整个AI生态的开放平台”。黄仁勋写道：“双方将共同扩大Hugging Face平台规模，强化其基础设施，让全球开发者与机构能够更便捷地使用人工智能。”（新浪财经）
