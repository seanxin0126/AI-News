- title: 国投智能：安保机器人业务目前处于试点验证阶段，正积极构建“平台+运营”业务闭环
  description: 36氪获悉，国投智能在互动平台表示，公司安保机器人业务目前处于试点验证阶段，正积极构建“平台+运营”业务闭环。依托“元枢”大脑AI能力以及公共安全场景积淀，公司探索联合头部保安服务企业共建运营平台，推进“租赁+服务”的RaaS商业模式，推动业务由硬件产品销售向安全运营服务转型，持续打磨试点成果的可复制化路径。业务由试点迈向规模化复制受多重条件共同制约，产品场景泛化适配能力、客户预算约束、行业采购机制等均会对业务推进产生影响，不存在单一决定性前置瓶颈，公司针对上述各环节同步开展优化打磨与应对工作。
