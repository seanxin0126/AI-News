- title: OpenAI推出GPT-6 Astra，称其为迈向通用人工智能的重要里程碑
  description: OpenAI正在发布新一代技术GPT-6，并将其定位为公司十年来推动通用人工智能（AGI）发展取得的一个关键里程碑。OpenAI周四表示，已向Daybreak项目中的企业用户推出GPT-6
    Astra。该计划允许获批测试者使用OpenAI能力最强的模型。OpenAI还计划向ChatGPT付费用户推出一个增加网络安全防护措施的版本。两个版本都设有安全机制，以防用户获取其最前沿的网络安全能力。（新浪财经）
