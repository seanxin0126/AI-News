- title: 美国初创企业创始人拼命追赶AI智能体的工作节奏
  description: "令人着迷、让人沉醉、让人全身心投入。这些词是美国初创企业创始人描述管理自己这批新“员工”——AI智能体时的感受。阿迪蒂亚·夏尔马最近熬了一整夜，和自己的多生成式AI机器人团队并肩工作，直到清晨6点才入睡。这类系统可以规划并执行多步骤任务，例如调取数据、编写代码。\r\
    \n夏尔马是Keel公司联合创始人，该企业面向IT团队开发AI故障排查软件。这些AI智能体正在开发新客户功能、为自研模型开展调研，同时监控营销推广活动。但AI智能体执行任务时，常常需要人为指引或是补充背景信息。27岁的夏尔马不得不全天候随时待命，作息彻底紊…"
  url: https://www.cnbeta.com.tw/articles/tech/1574448.htm
