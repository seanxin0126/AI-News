- title: Mistral完成30亿欧元D轮融资，投后估值超210亿欧元
  description: 9月8日，法国人工智能公司Mistral宣布完成30亿欧元D轮融资，投后估值超过210亿欧元。这是欧洲科技企业迄今规模最大的股权融资。三星电子领投本轮融资，EQT旗下Scaleup
    Europe Fund和现有投资者PSG Equity联合领投。Mistral表示，新资金将用于扩大算力和基础设施投入，加强前沿AI模型研发，并推动商业化和国际扩张。（界面）
  url: https://36kr.com/newsflashes/3974316731953666?f=rss
  source: 36kr.com
- title: 硬氪首发 | 99年同济副教授、前大疆骨干创业世界模型，成立不到一月融资数千万
  description: "硬氪获悉，世界模型企业「WorldMind」（寰宇心生）近日完成数千万元天使轮融资。资方为元生资本，此次融资将主要用于团队建设和扩张，以及基础设施和基础模型训练。点石资本担任公司独家财务顾问。\n\
    \ WorldMind成立于2026年9月，核心团队聚焦具身智能、世界模型与脑科学的交叉融合。创始人兼CEO任云帆出生于1999年，曾任大疆算法预研骨干，博士毕业于香港大学MaRS\
    \ Lab，后赴苏黎世大学RPG开展博士后研究。26岁入选国家级青年人才，现任同济大学博导、长聘副教授。\n CTO张奇为悉尼科技大学人工智能博士、国…"
  url: https://36kr.com/p/3973553316081920?f=rss
  source: 36kr.com
- title: 核能公司HGP拟借道SPAC上市，专为AI数据中心“灵活供电”
  description: 9月8日，知情人士透露，HGP Intelligent Energy计划通过一家特殊目的收购公司（SPAC）实现上市，交易对该核能服务企业的估值约为12亿美元。该公司技术旨在使核反应堆能够根据人工智能(AI)数据中心实时波动的用电需求灵活调节功率。知情人士还表示，该公司也将为地方电网提供同样的调峰服务。（财联社）
  url: https://36kr.com/newsflashes/3975403140919809?f=rss
  source: 36kr.com
- title: 三星SDS将扩大与OpenAI等合作，以推动AI转型
  description: 韩国三星集团旗下的信息技术服务子公司三星SDS周二表示，将扩大与全球主要人工智能（AI）企业的合作，包括OpenAI和Anthropic，以推动通过AI转型实现创新。该公司在年度峰会上宣布了这一消息，会上公布了名为
    AX 的发展愿景，旨在推动企业与工作流程层面加速人工智能转型。三星SDS表示，将成为首家参与OpenAI“Daybreak合作伙伴计划”试点合作的韩国企业。（新浪财经）
  url: https://36kr.com/newsflashes/3974331759587847?f=rss
  source: 36kr.com
- title: AI模型加速迭代，AI基础设施需求再受关注
  description: 日前，OpenAI发布新一代人工智能（AI）模型GPT-6 Astra，进一步提升模型操作电脑、执行复杂任务的能力。英伟达首席执行官黄仁勋随后在社交平台上表示，“通用人工智能（AGI）已经到来”，引发市场关注。伴随新模型发布，A股算力硬件板块、韩国存储芯片龙头走强，AI基础设施需求再受关注。机构认为，模型能力提升正在拓展AI的应用空间，企业和用户也更加重视使用成本与投入产出比。随着模型加快进入实际工作流程，算力需求、任务执行效率和商业化进展成为观察产业发展的重要线索。（中证报）
  url: https://36kr.com/newsflashes/3975399026929920?f=rss
  source: 36kr.com
- title: “H回A”案例持续涌现，人工智能赛道相关企业正成为“回A”队伍中新的增长极
  description: 近日，港股上市企业云英谷科技股份有限公司发布公告称，已与广发证券股份有限公司签署A股辅导协议，正式启动“回A”进程。值得注意的是，该公司于今年5月底登陆港交所，仅三个多月便筹划“回A”，开启“A+H”两地上市战略布局。梳理发现，截至9月7日，年内已有15家港股上市公司披露“回A”相关进展。整体来看，这批企业普遍具备高研发投入、高技术壁垒、高成长预期的“三高”特征。从行业分布来看，医疗保健和信息技术企业是本轮“回A”主力，其中，AI（人工智能）赛道相关企业正成为“回A”队伍中新的增长极。（证券日报）
  url: https://36kr.com/newsflashes/3973990242382342?f=rss
  source: 36kr.com
- title: Anthropic据悉放弃以60亿美元收购AI初创公司Decart的交易
  description: 据知情人士称，Anthropic PBC已决定放弃收购人工智能初创公司Decart AI。知情人士表示，Anthropic一直在寻求交易并对Decart进行了尽职调查，但最终放弃收购。由于涉及非公开信息，知情人士要求匿名。其中一位知情人士表示，两家公司或许仍会寻求其他合作机会。Anthropic和Decart的代表均拒绝置评。（新浪财经）
  url: https://36kr.com/newsflashes/3974114672570633?f=rss
  source: 36kr.com
- title: 面壁智能开源端侧语言基础模型MiniCPM5-2B
  description: 36氪获悉，9月8日，人工智能基座大模型公司面壁智能联合OpenBMB开源社区正式开源新一代“小钢炮”MiniCPM5-2B。MiniCPM5-2B
    的参数规模为 2B，是一款高密度端侧语言基座模型，支持工具调用、深度搜索、代码生成等任务，初步实现了端侧通用Agent雏形。
