- title: 中信证券：中国光模块龙头企业有望在全球算力供应链中持续巩固领先地位
  description: 36氪获悉，中信证券认为基金重仓配置的持续提升，充分印证了AI算力产业链在技术迭代加速背景下的长期投资价值。当前800G光模块进入规模化交付高峰期，1.6T产品出货进程提速，同时硅光集成、NPO及CPO等下一代光互联技术路线日趋成熟，中国光模块龙头企业凭借先发优势与产能储备，有望在全球算力供应链中持续巩固领先地位。此外，国内外AI资本开支维持高景气，算力基础设施从训练端向推理端延伸，建议重点关注光模块、光芯片、AIDC、交换机、服务器等算力配套板块的结构性机遇。
  url: https://36kr.com/newsflashes/3927312070736006?f=rss
  source: 36kr.com
