- title: OpenAI发布公开信，呼吁采取网络防御行动
  description: 当地时间8月27日，OpenAI发布一封呼吁全球加强网络防御的公开信，由包括Anthropic、AWS、谷歌、微软、OpenAI和甲骨文在内的100多家组织联名签署。该公司表示：“随着全球各地模型能力不断提升，“借助人工智能发起的网络攻击将变得愈发广泛和复杂。”（界面）
