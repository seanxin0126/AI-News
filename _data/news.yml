- title: 阿布扎比AI企业G42据悉考虑融资数十亿美元
  description: 据报道，阿布扎比人工智能企业G42已与潜在投资者就融资数十亿美元展开初步洽谈，但融资规模及具体形式尚未最终确定。G42现有投资者包括阿布扎比主权财富基金穆巴达拉、美国私募股权公司银湖资本和微软。G42业务涵盖云计算、数据中心和AI应用，目前正建设一座总功率5吉瓦的阿联酋—美国AI园区。（界面）
