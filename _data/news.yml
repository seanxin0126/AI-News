- title: 周期与科技双线交锋，百亿级私募演绎拉锯战
  description: 上市公司半年报绘制的“藏宝图”正持续展开，百亿级私募在周期与科技之间展开激烈博弈。作为高毅资产旗下的明星基金经理，邓晓峰加仓万华化学、新进北新建材，试图在化工建材赛道复刻昔日紫金矿业式的周期投资神话；睿郡、聚鸣等机构则扎堆涌入半导体、物联网及智能制造领域，持续挖掘科技领域的价值富矿，海康威视更上演了连续减持与连续增持的“多空对峙”，机构间的观点大相径庭。不过，喧嚣的调仓底牌背后暗藏不确定性，在经历7月科技股剧烈回调后，这份投资图谱或已面目全非，盲目跟风者需警惕成为过期信号的买单人。（中证报）
  url: https://36kr.com/newsflashes/3955609932397958?f=rss
  source: 36kr.com
- title: 首发｜星邑空间完成数亿元A轮融资，一家商业航天测运控公司的八年长跑与「重生」
  description: "文 | 阿至\n “做隐姓埋名人，干惊天动地事。这是我们这个赛道特别明显的写照。”星邑空间成立八年，创始人王铮很少走到台前。\n 今年商业航天再次成为一级市场焦点。火箭公司冲刺IPO，卫星创企批量涌现，太空算力成为时下最有想象空间的概念，但在一轮又一轮热潮中，航天测运控，这个连接航天天地系统的关键一环，更多处于聚光灯的边缘。\n\
    \ 作为一个幕后环节，它没有火箭发射时的烈焰与轰鸣，也不容易成为资本故事里的主角。但它实际承载着卫星从入轨到价值终结的全部生命线，用王铮的话说，“从火箭点火开始，卫星的全寿命管理就交给测运控来完成…"
  url: https://36kr.com/p/3956027533507970?f=rss
  source: 36kr.com
