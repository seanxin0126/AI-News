- title: Naver第二季度净利润高于市场平均预期
  description: 得益于核心搜索平台和电商业务的稳定增长，韩国互联网巨头Naver公布了稳健的第二季度业绩。Naver公布的业绩好于市场平均预期，营收增长16%，至3.389万亿韩元；营业利润微降0.2%，至5203亿韩元。与此同时，这家韩国主导搜索引擎背后的公司一直在扩大其人工智能（AI）的布局，最近与AI芯片领导者英伟达和美国私募股权投资公司博枫达成了数以十亿美元计的合作，以建立千兆瓦级的AI云基础设施。（新浪财经）
