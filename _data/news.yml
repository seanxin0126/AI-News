- title: Anthropic发布新一代Claude Opus 5模型 性能逼近旗舰级并降低一半使用成本
  description: "人工智能初创企业Anthropic今日正式推出了新一代AI模型Claude Opus 5，作为此前Opus 4.8版本的重大升级。根据官方介绍，Opus\
    \ 5专为日常高频使用场景打造，在整体性能上已接近其最顶尖的旗舰模型Fable 5，而使用成本仅为后者的一半。\r\n在多项权威基准测试中，Opus 5的表现均超越了Opus\
