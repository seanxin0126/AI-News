- title: 高通与亚马逊达成协议，共同建设人工智能数据中心基础设施
  description: 高通与亚马逊达成协议，共同建设人工智能数据中心基础设施，将合作开发高达1.6T的光互联解决方案。高通科技与亚马逊还将合作开发高性能光连接解决方案，以支持AI基础设施日益增长的规模和带宽需求。此次合作将利用高通技术先进的SerDes和光DSP技术。作为扩大合作的一部分，高通科技计划加深对AWS
    AI基础设施（包括亚马逊Bedrock）的应用，用于电子设计自动化（EDA）工作负载，目标是缩短芯片设计周期。（财联社）
  url: https://36kr.com/newsflashes/3975357845778948?f=rss
  source: 36kr.com
- title: 从单点工具到统一平台架构，临床试验AI加速落地 | 最前线
  description: "文 | 刘凌果\n 编辑 | 海若镜\n “AI已经展现出加速临床开发的潜力。许多过去拖慢新药开发的工作，可以由AI更快完成。”\n\
    \ 9月3日，临床试验解决方案提供商Medidata在上海举办NEXT中国年会，探讨AI在临床试验中的应用趋势及规模化落地前景。\n 会上，Medidata首席执行官Anthony\
    \ Costello、首席运营与战略官Lisa Moneymaker等公司高管，重点展示了公司今年7月推出的Medidata Plus，以及智能助手Dot。前者定位为覆盖临床试验全流程的AI平台架构，后者则是前者的核心…"
