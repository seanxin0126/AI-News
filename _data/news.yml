- title: 智能体走进办公场景，多家科技大厂发布相关产品 AI员工上岗了
  description: AI办公智能体正在进入企业一线业务场景。在晶科能源，财务人员月度预算分析用时从2天缩短至15分钟；在蒙牛，一线员工自主开发出45个AI数字员工，覆盖研发、供应链、销售等多个业务域……在制造业、零售业、医疗业等多个领域，AI正从“对话工具”变成“干活员工”。企业端的试用和部署稳步推进，供给侧也及时跟进。6月以来，腾讯、阿里巴巴、百度、字节跳动、金山办公、360等6家头部科技企业密集推出AI办公产品。与此同时，AI办公已从各家科技公司的边缘探索升级为核心业务条线。（上证报）
  url: https://36kr.com/newsflashes/3966908782042375?f=rss
