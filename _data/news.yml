- title: 国内首个辅助生殖诊疗AI智能体上线：锦欣生殖推出自研“IVF领航员”
  description: 近日，由锦欣生殖旗下成都锦欣信息科技有限公司自主研发的“IVF领航员”（IVF Co-pilot）系统，在四川锦欣西囡妇女儿童医院（毕昇院区）启动试点。据了解，这是辅助生殖领域首个面向医生（To
    Doctor）的临床辅助AI智能体。该系统面向辅助生殖诊疗全流程，当前聚焦IVF（试管婴儿）促排方案及启动用药的辅助评估。系统将医院临床经验、IVF专业知识、临床算法与本地大模型融入电子病历工作流，为医生提供可比较、可追溯、可复核的辅助信息和临床决策参考。
