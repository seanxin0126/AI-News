- title: 璇玑动力：首款工业级重载四足机器人已实现量产并交付
  description: 记者从具身智能独角兽企业璇玑动力获悉，该公司首款工业级重载四足机器人Hypertron T01已实现量产，并已批量交付头部电网企业投入常态化运行。目前，璇玑动力已实现包括轴向磁通电机在内的高性能机器人本体及核心零部件全栈自研，形成“研发—量产—落地”全链路闭环。（证券时报）
