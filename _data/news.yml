- title: 抖音等入股未来不远机器人
  description: 36氪获悉，天眼查工商信息显示，近日，上海未来不远机器人科技有限公司发生工商变更，新增抖音旗下北京量子跃动科技有限公司、纳爱斯浙江投资有限公司等为股东，同时，注册资本由约628万人民币增资约769万人民币。该公司成立于2022年9月，法定代表人为陈奕荃，经营范围包括智能机器人的研发、人工智能基础软件开发、工业机器人制造等。
