- title: 近500家公司公布半年报，AI硬件、化工能源景气度高
  description: 又到A股上市公司半年报“交卷时刻”。据不完全统计，截至8月16日晚间已有476家上市公司披露半年报，其中2026年上半年净利润为正的公司有420家，占比88.24%；净利润同比增速超100%的公司有114家，同比实现正增长的有323家。值得关注的是，人工智能（AI）算力需求持续释放，成为拉动科技制造板块业绩的引擎。工业富联受益于AI服务器及相关业务放量，上半年净利润同比增长95.99%；寒武纪、海光信息营收增速均超过60%，净利润分别增长122.61%和49.69%，展现出国产算力产业链业绩加速兑现的态势。江波龙…
