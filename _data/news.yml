  description: "作者 | 乔钰杰\n 编辑 | 袁斯来\n 硬氪获悉，全域场景下具身智能系统供应商「星际觅元」近日完成千万元种子轮融资，由同创伟业领投，家庭具身智能机器人企业卧安机器人和旭源资本跟投。目前客户群体包括国内主流智能具身智能厂商，以及能源、高端制造等行业场景客户。\n\
    \ 「星际觅元」成立于2026年7月，由中新国际联合研究院智能感知创新研发中心执行主任温明星博士创立，新加坡工程院院士王郸维教授担任首席科学家。公司核心团队成员来自新加坡南洋理工大学、哈尔滨工业大学、北京理工大学、华南理工大学以及国内上市公司高管。\n\
