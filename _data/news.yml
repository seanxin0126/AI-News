- title: AI短剧制作价格大跳水
  description: 今年以来，AI短剧迎来一轮爆发：技术门槛下降，大量从业者涌入，产能快速扩张，制作价格随之“跳水”。同样制作AI短剧，每分钟报价从5000元跌至几百元，逼近成本线；但定制短剧业务依旧可以达到每分钟1万‑2万元。当“会制作”不再是稀缺能力，AI短剧行业竞争正从拼产量、拼价格，转向拼内容、拼市场。数据显示，预计2026年国内AI剧漫剧市场规模有望超400亿元，同比增速138%。海外市场表现同样亮眼，规模预计突破40亿美元，占海外微短剧整体规模近70%。（央视财经）
