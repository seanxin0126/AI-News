- title: AI应用进入重估期，私募衡量赛道长期价值
  description: 近日，宇树科技登陆A股，为具身智能板块提供了具备规模化盈利与批量出货能力的可比标的。市场情绪随之升温，人形机器人、AI Agent、AI办公等赛道进入价值重估期。多位一、二级市场的私募人士表示：宇树科技上市在一定程度上确立了当前人形机器人和AI应用赛道估值的参照系，但未必能成为相关板块可持续的估值锚。AI应用正从概念叙事走向订单验证，但兑现的节奏可能仍慢于“市场情绪的升温”。另外，尽管产业前景与静态业绩的“剪刀差”仍然显著，但私募机构依旧在积极衡量这一赛道的长期价值。（中证报）
  url: https://36kr.com/newsflashes/3958394502904961?f=rss
  source: 36kr.com
- title: 群核科技：上半年AI相关收入同比大增177%，世界模型产品启动内测
  description: 8月27日，空间智能企业群核科技发布2026年中期业绩公告。报告期内，群核科技实现营业收入4.05亿元，经调整净利润5542万元，接近去年全年盈利水平，同比增长211%。其中，AI新应用及新产品收入同比增长超过177%。值得注意的是，公司9月初有望纳入港股通，进一步提升股票的流动性。在模型层面，群核科技近日发布3D生成模型Lux3D，并开启新一代世界模型产品的内测。
