- title: 美联邦政府被裁禁止拉黑AI公司Anthropic
  description: 美国加州北区联邦地区法院法官当地时间8月27日裁定，美国国防部将美国人工智能（AI）企业安特罗匹克（Anthropic）公司列入黑名单属于非法行为。法官丽塔·林在裁决书中写道：“无可争议的事实记录表明，美国国防部的行为构成了对宪法第一、第五修正案的违反。事实记录进一步表明，美国国防部长赫格塞思将Anthropic指定为‘供应链风险’的决定违反了相关法定框架……且属于武断和反复无常的行为，这一点不存在实质性争议。”（央视新闻）
  url: https://36kr.com/newsflashes/3958546556386690?f=rss
  source: 36kr.com
