- title: 芯片行业景气高涨，韩国拟利用“意外超额财政收入”设立“未来基金”
  description: 韩国企划财政部周五表示，韩国将设立“未来基金”，依托本轮人工智能产业繁荣带来的税收增量——政府称之为意外超额财政收入，推动本国经济长期增长。
    企划财政部联合相关政府部门公布该方案，称人工智能产业带来的不只是一场技术革命，更推动经济、社会制度等诸多领域发生重大转型。 企划财政部表示：“受全球芯片行业繁荣带动，企业税收入增加，国内税收预计将大幅攀升。”
    该部门补充道：“我们应当把当前形势下获得的财政财力，当作宝贵筹码，在全球科技制高点竞争中抢占先机。”（新浪财经）
  url: https://36kr.com/newsflashes/3948698317127040?f=rss
  source: 36kr.com
- title: 机器人“大脑”加速进化，模型与数据成为产业竞争新焦点
  description: 过去，机器人大会上的“明星”往往是能够完成复杂动作的机器人本体。今年，产业关注点正在发生变化：从“机器人能做什么”，转向“机器人如何学会更多事情”。在2026世界机器人大会现场，越来越多企业展示的不再只是机器人行走、抓取、运动控制等单项能力，而是围绕具身智能模型、世界模型、数据采集、仿真训练等底层能力展开布局。机器人产业竞争正在从过去的硬件性能比拼，转向“模型+数据”的综合能力竞争。这一变化背后，是人工智能技术向物理世界加速延伸。业内人士认为，机器人要真正进入生产生活场景，不仅需要具备执行任务的能力，也需要形成对…
  url: https://36kr.com/newsflashes/3948570144914565?f=rss
  source: 36kr.com
- title: 模型不拼参数拼闭环、讲家庭场景落地，今年的大会不再「性感」丨直击WRC2026
  description: "文｜邱晓芬 黄楠 \n 编辑｜袁斯来 \n 8月20日，世界机器人大会（下称WRC）在北京亦庄国创会展中心举办。开展恰逢宇树上市，其市值最高点超过4000亿，给本就燥热的行业新添了一把火。\n\
    \ 今年的WRC吸引了300多家展商参加，数量直接比去年暴涨了4成，参展的机器人产品更是高达3000台。\n 新面孔中，除了新一批的具身初创公司之外，还有实在的客户——据官方数据披露，今年有49家央企组团进场，带着12个真实工程场景（电网、航天、矿冶等）来找机器人。\n\
