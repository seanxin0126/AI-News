- title: 三星拿下2000亿美元大单 将向博通供应芯片
  description: "三星电子获得一份价值逾2000亿美元的合同，将向博通供应芯片，两家公司正努力在人工智能（AI）基础设施市场争取更大份额。三星电子周六在一份声明中称，这项为期五年的协议将持续至2030年，重点围绕为博通产品提供三星2纳米及以下先进制程工艺。协议将深化两公司在存储芯片和晶圆代工技术领域的战略合作。\r\
    \n面对来自台积电等对手日益激烈的竞争，三星和韩国本土同行SK海力士正加速在全球范围内争取AI芯片订单。韩国力争五年内将存储芯片产能翻一番，确保拥有世界一流的制造能力，从而远远领先于其他国家。三星表示，在存储芯片领域，双方的…"
