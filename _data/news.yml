- title: “科技成长+周期修复”驱动，龙头公司半年报亮眼
  description: Wind数据显示，截至8月13日17时，已有358家A股上市公司披露2026年半年报，其中超七成公司实现营业收入和归母净利润的同比增长。在这些公司中，半导体、化工、有色金属等行业景气度上行，AI算力产业链龙头公司业绩增幅显著。市场人士认为，上述公司的业绩增长整体呈“科技成长+周期修复”双轮驱动态势。随着半年报进入密集披露期，市场逻辑正从估值驱动向盈利验证切换，科技赛道的龙头公司业绩表现值得关注。（中证报）
