- title: 美国多家人工智能公司旗下服务同日发生故障
  description: 美国多家人工智能公司旗下服务3日在相近时段发生故障，部分用户一度无法正常使用聊天、应用程序编程接口（API）等服务。目前相关主要服务均已恢复，公开信息尚不能确认几起故障是否存在共同原因。多家主要人工智能公司旗下服务在相近时间发生故障较为罕见。目前三家公司公布的信息尚不能确认几起故障是否存在共同原因。（新华社）
