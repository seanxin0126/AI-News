- title: 尧乐科技发布一体针织数据手套，让触觉采集回归真实人手动作｜最前线
  description: "作者｜黄楠\n 编辑｜袁斯来\n 具身智能正从Demo演示走向真实场景落地。视觉与语言模型的能力边界在持续扩展，但物理交互维度的触觉数据供给短缺，正成为机器人精细操作与场景泛化能力提升的核心制约。\n\
    \ 目前行业主流触觉采集方案各有瓶颈：薄膜压阻手套存在滑移伪信号与数据漂移，外骨骼式手套约束自然抓取姿态、引入噪声，视触觉方案难以实现掌心全域覆盖。实验室级设备性能优异但价格高昂，难以支撑大批量采集；仿真数据则始终无法弥合虚实鸿沟。\n\
    \ 如何兼顾轻量化、全域感知、长期稳定性与规模化成本，成为摆在产业面前的现实命题。\n 近日，柔…"
