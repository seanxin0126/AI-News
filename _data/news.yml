- title: 韩美半导体将投资1300亿韩元建设其最大工厂
  description: 韩美半导体在一份声明中表示，计划投资1300亿韩元在仁川建造其有史以来最大的工厂，以扩大人工智能半导体设备的生产。该公司将斥资560亿韩元收购位于仁川的一处现有厂房，并将其改建为第八家工厂，预计将于2027年第二季度开始量产。该工厂将生产用于HBM的TC键合机和混合键合机，以及用于高性能存储器的2.5D封装设备、BOC和COB封装设备。该公司表示，这将使其现有生产设施与全球最大的HBM
    TC和混合键合器生产基地相结合，成为全球最大的生产基地。（新浪财经）
  url: https://36kr.com/newsflashes/3944466897157248?f=rss
  source: 36kr.com
- title: 词元消耗成授信依据，银行积极试水“词元贷”
  description: 作为AI（人工智能）领域的专业术语，词元（Token）正在变成金融机构使用的“信用词汇”。近日，广东省首个词元经济专项金融产品“词元贷”在广州市海珠区发布，中国银行、中信银行、广州银行3家银行率先参与布局。其中中国银行已落地授信额度。受访专家认为，依托词元消耗数据形成的“技术账本”，正在成为银行构建信贷评估体系的新依据，其实质是企业信用评估在算力场景下的数字化延伸。“词元贷”回应的融资痛点真实存在，构建的数据信用逻辑亦有价值，但支撑该逻辑的数据基础设施、风控方法论及监管框架，目前仍在建设中。（证券日报）
  url: https://36kr.com/newsflashes/3944319537560963?f=rss
  source: 36kr.com
