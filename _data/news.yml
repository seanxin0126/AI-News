  source: 36kr.com
- title: Anthropic筹备大型IPO加紧稳住市场信心
  description: Anthropic正密集接洽潜在投资者，力求稳住市场信心。这家公司即将启动的IPO有望创下人类有史以来最大上市募资规模；它一方面向投资方承诺将维持高速增长，另一方面也阐释了自身规划，希望以此化解公众对人工智能日益高涨的抵触情绪。知情人士称，在路演交流中，Anthropic管理层向投资者表示公司正全力聚焦研发前沿顶尖大模型。知情人士还透露，Anthropic计划于今年9月或10月初正式挂牌上市；它最大的竞争对手OpenAI的IPO计划则已延后，预计最晚明年才会启动。（新浪财经）
