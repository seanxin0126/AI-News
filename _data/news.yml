- title: 前安克高管做智能房车，获元禾、厚雪等超2亿融资，首款产品2027年初量产｜硬氪首发
  description: "作者｜黄楠\n 编辑｜袁斯来\n 硬氪获悉，户外出行硬科技企业松鼠动力近日完成超2亿元A轮系列融资，投资方包括元禾璞华、元禾厚望、厚雪资本、金沙江联合资本、天堂硅谷、中科创达、光远和声基金、不同资本、神骐资本、活水资本及春珈资本等产业资本与专业财务机构。\n\
    \ 本轮资金将重点投入Evotrex-PG5整车车规级深度验证、研发测试，加快产线搭建与产能扩建工作，全面扩充制造能力，以保证2027年大批量交付目标顺利落地。\n\
    \ 松鼠动力成立于2023年，是一家聚焦户外电动化与智能化产品研发、制造与全球化运营的硬科技初创企业，旗下品…"
