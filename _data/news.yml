- title: 美格智能：终止研发中心建设项目 并调整为AI研发及先进制造产业项目
  description: 36氪获悉，美格智能公告，公司董事会审议通过议案，拟终止西安“研发中心建设项目”，将剩余募集资金4435.30万元投入“5G+AIoT模组及解决方案产业化项目”，并将该项目整合调整为“AI研发及先进制造产业项目”，投资总额增至5.71亿元，拟投入募集资金4.37亿元，建设期延长至2030年12月。该议案尚需提交股东会审议。
