- title: 李泽湘投过的商业园林机器人完成数千万融资，瞄准海外绿地智能运维｜硬氪首发 |
  description: "作者 | 黄楠\n 编辑 | 袁斯来\n 硬氪获悉，商业园林机器人公司食铁兽科技（PANDAG）近日完成数千万元A轮融资，本轮由云时资本独家投资，星⾠资本担任财务顾问。资金将重点投入欧美澳市场交付体系搭建及全球渠道布局。此前，公司已获得李泽湘教授、奇绩创坛、险峰⻓⻘等机构投资。\n\
    \ 食铁兽成立于2021年，公司以PANDAG G1商用割草机器人切入，围绕硬件模块化、设备运营和作业数据闭环，向多任务商业园林机器人的平台化方向演进。\n\
    \ 2025年，食铁兽科技完成首条自有产线搭建并实现量产交付，产品已在多个海外市场进入实际作…"
  url: https://36kr.com/p/3947977664347270?f=rss
  source: 36kr.com
- title: 小鹏机器人首轮融资超9亿美元，投后估值约430亿元
  description: 36氪获悉，小鹏机器人业务完成首轮超9亿美元融资，投后估值超63亿美元（约430亿元人民币），刷新中国具身智能行业单轮私募股权融资纪录。本轮融资由IDG资本领投，高榕创投参投，同时获得腾讯和阿里巴巴两家战略投资者的支持；小鹏集团继续控股机器人业务。本轮融资后，小鹏机器人将加速量产及小鹏物理AI模型的研发迭代，推动高阶通用人形机器人迈向全球商业化应用新阶段。
  url: https://36kr.com/newsflashes/3953307861433730?f=rss
  source: 36kr.com
- title: 零跑汽车确认布局机器人业务，称将很快发布正式公告
  description: 8月24日，在零跑汽车2026年中期业绩电话会上，公司副总裁李腾飞回应机器人业务传闻称，新能源汽车企业、尤其是具备全域自研能力的新能源汽车企业，是最具备条件做机器人的企业之一，零跑确实在这方面有我们自己的规划，具体信息将很快通过正式公告发布。此前工商信息显示，零跑旗下浙江凌昇动力科技有限公司于2026年7月全资设立湖州凌昇精密制造有限公司，注册资本2.1亿元，经营范围包含工业机器人制造、智能机器人研发。（界面）
  url: https://36kr.com/newsflashes/3953509263703432?f=rss
