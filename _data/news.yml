- title: Crusoe据悉与Jane Street签署价值约130亿美元的AI云协议
  description: 据知情人士透露，数据中心初创公司Crusoe与量化交易公司Jane Street Group签署了一份价值约130亿美元的云计算协议。Crusoe此前已与Meta
    Platforms和甲骨文等公司签约，为其提供人工智能算力。知情人士表示，根据这份为期五年的协议，Crusoe将通过其云平台向Jane Street提供搭载先进AI芯片的计算集群，以及用于人工智能训练和推理所需的其他基础设施。（新浪财经）
