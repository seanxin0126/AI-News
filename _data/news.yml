  description: 摩根士丹利发布研报称，联想集团将于下周公布截至今年6月底止2027财年首季度业绩，预测受基础设施方案业务收入及利润率上升带动，经调整纯利将达到约7.88亿美元，同比增长102%，按季增长41%，较市场预期高约12%。该行对联想2027至2029财年经调整纯利的预测较市场预期高14%、20%及25%，目标价由30港元上调至34港元，维持“增持”评级。大摩指出，供应链渠道数据续显示AI及通用伺服器订单持续强劲，相信市场可能低估了联想ISG的订单积压情况及盈利执行能力。大摩目前预测联想首财季收入达240亿美元，同比及按…
