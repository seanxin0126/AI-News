- title: 新石器无人车在天津成立新科技公司，注册资本500万
  description: 36氪获悉，天眼查App显示，新石器途翼（天津）科技有限公司于2026年8月13日成立，法定代表人为李子夷，注册资本500万元人民币，登记状态为存续。股权信息显示，该公司由新石器无人车关联公司新石器慧通科技股份有限公司全资持股，认缴出资500万元人民币，企业类型为有限责任公司（法人独资）。其经营范围涵盖人工智能应用软件开发、人工智能基础软件开发、人工智能理论与算法软件开发、汽车零配件批发、计算机及通讯设备租赁、国内货物运输代理及外卖递送服务等。
