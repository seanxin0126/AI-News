- title: AMD发行47.5亿美元债券，创最高规模发债纪录
  description: 美国芯片制造商超威半导体，也就是AMD，当地时间8月13日发行债券，将筹集资金47.5亿美元。这也创下公司最高规模发债纪录，预计债券于8月17日完成交割。分析指出此次发债凸显出，半导体企业愈发依靠资本市场融资，加紧布局人工智能相关投资、扩建数据中心以及推进制造项目。近期，AMD公布了与Anthropic、微软达成的多项合作，相关合作将扩大其芯片应用范围。市场分析显示，AMD今年营收预计较2025年增长47%，有望突破510亿美元。（央视财经）
  url: https://36kr.com/newsflashes/3939140377230729?f=rss
  source: 36kr.com
