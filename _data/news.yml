- title: 硬氪首发｜东莞人工智能研究院孵化，瞄准模具制造领域物理AI研发，这家企业获创新工场数千万种子轮融资
  description: "作者｜乔钰杰\n 编辑｜袁斯来\n \n 本文2100字，预计阅读5分钟。\r\n\n \n 硬氪获悉，制造物理AI公司合木人工智能科技（成都）有限公司（以下简称“合木智能”）日前完成种子轮千万级融资，投资方为创新工场。\n\
    \ 合木智能成立于2026年5月，由东莞市新一代人工智能产业技术研究院联合模具制造企业端品精密孵化成立，是一家专注于模具物理AI、制造语义计算及落地的公司。\n\
    \ 具体来看，合木智能希望在机械图纸深度学习的基础上，进一步学习和复刻老师傅积累的工艺经验，为模具制造企业构建AI工艺大脑，并将能力覆盖产品报价、模具设计、…"
  url: https://36kr.com/p/3963006194728324?f=rss
