- title: AI融资需求不断攀升，Alphabet考虑首次发行澳元债券
  description: 随着美国科技巨头竞相为人工智能（AI）投资募集资金，谷歌母公司Alphabet已聘请银行准备首次发行澳元债券。承销行之一的澳新银行在电邮声明中称，Alphabet可能发行四个期限的债券，最长达20年。Alphabet本月早些时候已在美元市场发行250亿美元债券，2026年还分别发行了瑞士法郎、英镑、欧元、加元和日元债券。该公司近期还通过股权融资筹集近850亿美元。（新浪财经）
  url: https://36kr.com/newsflashes/3942897284971909?f=rss
