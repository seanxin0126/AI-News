- title: 美国政府拟拨巨资重构科研体系 科学界担忧政治介入与资本化挤压基础研究
  description: "美国政府近日宣布启动名为“创世纪计划”（Genesis Mission）的重塑科研体系项目，计划拨付50亿美金资助数百项以人工智能（AI）为核心驱动力的科学研究。与此同时，白宫科技政策办公室（OSTP）主任迈克尔·克拉齐奥斯（Michael\
    \ Kratsios）在国会听证会上提交了题为《科学：新的黄金时代》的战略报告，明确提出将大幅调整联邦科研资金分配机制，优先保障人工智能、机器人技术及核能等应用领域的研发需求，并削减生命科学等传统基础研究预算。\r\
    \n根据美方公布的规划，首批“创世纪计划”资金将涵盖药物研发、生物医学…"
