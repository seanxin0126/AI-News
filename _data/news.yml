- title: 英伟达洽谈投资Perplexity，企业估值或超300亿美元
  description: 据知情人士透露，英伟达正洽谈对AI初创企业Perplexity进行股权投资，本轮融资完成后这家AI公司估值或将超过300亿美元。知情人士称，本轮融资规模达数十亿美元，相比该公司一年前上一轮融资，估值增幅将超过50%。两家企业的业务合作持续深化；得益于AI智能体产品Perplexity
    Computer（面向职场用户、可自动化电脑操作），Perplexity 年化营收从年初不足2.5亿美元攀升至7.5亿美元以上。（新浪财经）
