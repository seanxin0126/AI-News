  description: 36氪获悉，AI新材料研发公司“鼎犀智创”（Rhinovate™）完成数亿元Pre-A轮融资，本轮融资由鼎晖百孚领投，九合创投、彬复资本、龙芯创投、顺禧基金、中关村资本跟投。本轮资金将重点用于RhinoMat材料科学基础大模型及底层技术研发、多场景可编排AI智能体与自主进化实验室体系建设、碳基高性能材料放大验证，持续沉淀核心技术与实验数据。
