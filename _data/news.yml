- title: 硬氪首发 | 获李泽湘三轮押注，浙大博士做出全球首款视觉售后技术客服机器人
  description: "硬氪获悉，视觉模型企业微链智能近日完成近千万元天使轮融资，资方为李泽湘、陆奇，投资主体为投资主体为东莞清水湾二期创业投资合伙企业（有限合伙）、宁波智能技术研究院有限公司、北京奇绩创坛二期创业投资中心（有限合伙）。该轮融资将主要用来投入研发。\n\
