- title: 阿布扎比G42考虑引入美国资本控股，保障AI芯片获取
  description: 知情人士透露，总部位于阿布扎比的人工智能企业G42高管已开展初步磋商，探讨向美国企业出售多数股权，以求保障明年之后依旧可以获得高端芯片供应。这意味着该公司将迎来深度重组。G42由一位颇具影响力的王室成员监管，约8年前成立，承载阿布扎比首次大规模进军科技行业的目标。G42近期获得许可，可在无需美国出口许可的情况下采购尖端AI芯片，许可有效期至2027年4月前后；但想要继续拿到芯片，该公司必须调整自身公司架构。知情人士表示，高管正在研究多种方案，破解这一障碍。知情人士称，商讨中的方案包括引入美国企业成为多数控股股东，…
