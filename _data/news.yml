- title: 马斯克预测10年后人形机器人数量将突破10亿台
  description: 美国企业家马斯克当地时间9月1日预测，人形机器人市场将带来一场惊人变革。马斯克当天表示，到2036年，全球人形机器人数量将突破10亿台。联合国此前预测，到2037年全球人口会达到约90亿，按此估算，届时相当于平均每9人就拥有一台人形机器人。马斯克称，十亿台人形机器人的生产力将超过所有人类生产力的总和。他还预测，人工智能技术可能使全球经济规模增长20%至30%，这意味着每年能带来约20万亿至30万亿美元的经济增量。（央视财经）
  url: https://36kr.com/newsflashes/3966897315699973?f=rss
  source: 36kr.com
- title: Anthropic将推出人工智能模型Fable新版本
  description: Anthropic将发布其人工智能模型Fable的新版本。公司称，Fable 5.1在编程和科研任务方面表现更好，同时费用也更低。Anthropic表示，Fable
    5.1面向企业用户的词元单价将与Fable 5保持一致，但会下调模型重新调用此前已处理信息时的收费。公司称，这一环节的价格将下调75%，从而“大幅降低”模型整体运行成本。（界面）
