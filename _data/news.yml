- title: 中信建投：肿瘤mRNA疫苗开创肿瘤治疗新范式，国内企业加速追赶
  description: 36氪获悉，中信建投研报称，随着Moderna个性化肿瘤mRNA疫苗临床III期取得积极结果，mRNA肿瘤疫苗正朝着商业化阶段迈进，市场空间有望逐步打开。mRNA肿瘤疫苗与ICIs联用有望开创肿瘤治疗的新范式。分类来看，个性化肿瘤疫苗具有潜在更优的治疗效果，虽然生产成本较高，但也有更大的定价空间，而通用型疫苗凭规模化生产和较低成本，有望覆盖更广泛的患者群体。AI有望赋能多个环节，加速mRNA肿瘤疫苗的迭代升级。目前国内肿瘤mRNA疫苗研发正加速追赶，未来有望实现差异化突破，相关企业及产业链公司有望受益。
  url: https://36kr.com/newsflashes/3952791885872263?f=rss
  source: 36kr.com
