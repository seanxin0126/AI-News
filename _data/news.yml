- title: 三星拟投资2400亿韩元在韩国建设暖通空调生产线
  description: 三星电子在一份声明中表示，将投资约2400亿韩元，于韩国光州厂区投建FläktGroup暖通空调生产线。新生产线计划2028年建成并投产。该工厂将生产FläktGroup暖通空调系统，其中包含面向人工智能数据中心的高端冷却解决方案。三星计划依托该工厂拓展本国暖通空调业务，重点瞄准人工智能数据中心带来的增长需求，将暖通空调业务打造为全新增长引擎，并在2030年跻身该行业全球第一梯队企业。（新浪财经）
  url: https://36kr.com/newsflashes/3945809952030087?f=rss
  source: 36kr.com
- title: 看好AI投资机遇，QFII资金“广撒网”
  description: 今年二季度，QFII资金积极关注AI投资机遇。根据目前已披露的A股上市公司2026年半年报，QFII资金二季度新增持有国瓷材料、宏发股份、中材科技的市值均在10亿元以上，二季度国瓷材料、中材科技分别涨超230%、130%。同时，QFII资金也在持续挖掘中小市值个股的投资机会，外资机构二季度扎堆持有的美诺华、晓程科技等，7月以来均有明显的反弹。部分外资公募机构认为，8月中上旬市场的超跌反弹叠加了宏观、流动性的边际改善因素，是风险偏好与流动性的渐进修复窗口，但反弹斜率可能有限，目前市场缺乏清晰且有容量的板块性主线。（…
