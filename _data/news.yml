  description: 知情人士透露，沙特人工智能公司Humain计划面向海内外投资者募集首期25亿美元基金，用于投资沙特境内的数据中心项目。该基金将为Humain与穆阿迈尔信息系统公司合作建设的250兆瓦数据中心项目提供资金支持，相关项目远期规模最高有望扩充至1吉瓦。（财联社）
