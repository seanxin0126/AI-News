- title: 前字节、腾讯AI核心研发孙鹏加入星尘智能，负责机器人强化学习后训练｜最前线
  description: "作者｜黄楠\n 编辑｜袁斯来\n 36氪获悉，9月2日，前字节跳动强化学习专家、前腾讯Robotics X智能体中⼼负责⼈孙鹏博⼠正式加入星尘智能，将重点负责机器人强化学习方向的技术研发与应用探索。\n\
    \ 孙鹏博士毕业于清华大学，此后先后在康奈尔大学和罗格斯大学从事博士后研究。他长期专注强化学习（RL）、智能体（Agent）及多智能体强化学习（MARL）研究，拥有横跨机器人强化学习、大规模分布式RL系统与大模型强化学习的研究与产业实践经历，兼具算法研究与系统工程的技术积累。\n\
    \ 早前在腾讯 AI Lab 及 Robotic…"
