- title: “国家反诈AI”APP上线
  description: '为进一步提升防范电信网络诈骗工作的信息化、智能化水平，帮助群众有效识诈防诈，近日，公安部刑侦局指导，上海市公安局自主研发的“国家反诈AI”APP正式上线。


    “国家反诈AI”APP融合了大语言、多模态模型和智能体技术，用户通过手机输入可疑场景，该APP即可完成风险研判、识别诈骗套路、推送典型案例，从“文字+语音+视频”等多个维度拆解诈骗手法，提供识别防范对策。（新华社）'
