- title: 腾讯WorkBuddy宣布开放平台上线，全面开放Agent基座能力
  description: 36氪获悉，腾讯WorkBuddy宣布开放平台正式上线，首批引入超百家生态伙伴，面向智能硬件、行业应用与开发者等开放底层Agent能力。腾讯云副总裁、腾讯CodeBuddy
    & WorkBuddy负责人刘毅表示，真正的生产力从来不取决于一个工具有多强，而取决于它能连接多少能力、走进多少场景。我们希望把WorkBuddy打造成面向Agent时代的操作系统——不是做一个更强的工具，而是做一个能承载所有工具的平台。
