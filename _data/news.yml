- title: 英伟达服务器传出涨价消息 涨幅“很多情况下超过15%”
  description: 据媒体援引知情人士透露，多家“英伟达最大客户”已被告知，由于内存芯片成本飙升，搭载英伟达人工智能芯片的服务器价格将会上涨，很多情况下涨幅将超过15%。这一轮涨价将适用于明年年初出货的系统，包括搭载Vera
