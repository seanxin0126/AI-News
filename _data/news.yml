- title: 科创板上市公司投资脑机接口，微灵医疗获超亿元融资 ｜36氪独家
  description: "文｜刘凌果 胡香赟\n 编辑｜海若镜\n 36氪独家获悉，医学脑机接口企业微灵医疗，近日完成超亿元人民币融资。本轮融资由君重资本领投,英诺特（688253.SH）作为该基金的核心产业出资人，募集资金将重点用于推进植入式脑机接口核心产品的临床验证，加快医疗器械注册申报进程，完善生产制造体系建设，并持续拓展面向神经功能修复领域的临床应用布局。此前，微灵医疗已获得高榕资本、生命园创投、鼎晖投资、力合科创等多家一线投资机构加持。\n\
    \ 微灵医疗成立于2019年，是36氪持续跟踪的脑机接口企业。“让天下没有难治的脑病。”是微灵贴在…"
  url: https://36kr.com/p/3941648190242185?f=rss
  source: 36kr.com
- title: 美国投资级债券8月发行创历年同月新高，AI基建推动企业举债
  description: 随着人工智能基础设施建设支出推动企业举债，美国投资级债券发行规模连续第三个月创历年同月纪录新高，创纪录的发债速度仍在延续。数据显示，截至周一，8月美国投资级债券发行规模已达1452亿美元，超过2020年8月创下的1360亿美元历年同月纪录。今年1月、6月和7月也分别创下历年同月最高纪录，另有三个月的发行规模为历年同月第二高。（财联社）
  url: https://36kr.com/newsflashes/3944224336346503?f=rss
  source: 36kr.com
- title: AI集群规模进一步扩张，光通信产业链企业在手订单饱满
  description: 近日，海内外多家光通信产业链公司透露在手订单充裕，且订单能见度不断拉长，部分企业订单已排产至2027年，甚至2028年。从国内光模块、光器件厂商到海外光通信龙头，光通信行业迎来产能紧俏、客户持续锁定产能的阶段。从驱动因素来看，下游云厂商持续上调资本开支指引，加码人工智能数据中心与算力集群建设，成为拉动高速光通信需求的核心动因。（上证报）
  url: https://36kr.com/newsflashes/3942853682838661?f=rss
  source: 36kr.com
- title: 13F持仓报告最新总结：科技龙头、AI赛道调仓分化，多空博弈陷入胶着
  description: 美国证券交易委员会（SEC）披露的季度13F文件显示，今年第二季度，机构投资者在半导体、人工智能（AI）基础设施及大型科技股等关键板块上小幅缩减持仓，整体未出现明显的单向大额押注迹象。一项对6371家养老基金、对冲基金、财富管理机构及其他机构投资者提交的13F文件进行分析后发现，增持与减持的机构数量差距不大，但在许多情况下，减持一方略占上风。在被称为“七巨头”的超级科技股群体中（包括微软、Meta
    Platforms等），约44%的申报机构削减了持仓，而42%的机构选择新建或增持仓位。其余机构未披露持股变动。这批…
  url: https://36kr.com/newsflashes/3943206802603143?f=rss
  source: 36kr.com
- title: 高盛助攻英伟达：5000亿美元计划，破解AI基建最大资金瓶颈
  description: 英伟达正着手解决AI热潮中日益凸显的核心制约——融资难题。高盛已开始与保险公司、银行及资产管理公司接洽，推动英伟达动员超过5000亿美元资金，用于AI基础设施建设。此举有望让客户在无需将全部成本压在自身资产负债表上的情况下，持续采购日益昂贵的英伟达系统。这项于8月10日宣布的计划，将英伟达与高盛、阿波罗、贝莱德、黑石、布鲁克菲尔德和KKR等机构联合起来，打造独立的融资平台，专门服务于英伟达驱动的AI基础设施。英伟达可能为相关交易提供最高1250亿美元（约占总规模25%）的支持。（新浪财经）
  url: https://36kr.com/newsflashes/3942857258483078?f=rss
  source: 36kr.com
- title: Nebius和CoreWeave转向短期云业务合同
  description: 据报道，近日，新兴云厂商Nebius和CoreWeave相继向投资者推荐短期业务合同，两家云服务公司表示，在GPU供应紧张的情况下，这些短期合同将使他们能够从人工智能计算能力价格飙升中获利。（财联社）
