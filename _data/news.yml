- title: APEC二十一成员签署《成都声明》 首次将开源AI合作提升至部长级
  description: "在近期于中国成都举行的亚太经合组织（APEC）数字周期间，包括中国和美国在内的21个APEC成员经济体共同发表了关于人工智能的《成都声明》。该声明明确指出，各方将在恪守安全保障、数据保护及知识产权的基础上，支持开源人工智能的开发与应用，并特别强调所支持的模型和项目须在开发与部署的全流程中具备“强有力的安全保证”。\r\
    \n这一声明的签署标志着亚太地区在人工智能治理和技术路线选择上迈出了关键一步。与某些依赖封闭式付费模式的欧美科技巨头不同，中国企业推出的 DeepSeek、GLM\
