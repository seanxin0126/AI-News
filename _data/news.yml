- title: Anthropic合资公司Ode收购AI咨询商，拓展Claude企业市场
  description: Anthropic联合黑石等华尔街机构成立的合资企业完成自7月成立以来的首笔收购，此举意在推动旗下聊天机器人Claude在企业端的业务增长。据Ode方面消息，Anthropic这家合资公司Ode计划于周四宣布收购AI咨询公司Casper
    Studios。Casper Studios主要帮助企业开发AI应用。当前企业高管正探索如何最大化发挥AI价值，同时对这项新技术带来日益走高的账单心存顾虑，Ode选择在这一节点完成本次收购。（新浪财经）
