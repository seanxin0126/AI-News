- title: 宇树科技王兴兴：探索物理AI机器人自进化
  description: 8月20日，宇树科技董事长、总经理兼首席技术官王兴兴在2026世界机器人大会上表示，宇树科技在AI模型领域持续投入，并且这也是目前宇树科技资金与人力投入最多的方向。8月19日，宇树科技正式登陆科创板。截至8月20日收盘，宇树科技股价为687元，市值约为2779亿元。大会上，王兴兴首次公开阐释宇树科技探索的“物理AI机器人自进化”概念。他表示，过去数年间AI已广泛应用于编程与各类开发，但在机器人领域的运用仍不足。为此，宇树科技正推动物理AI机器人模型自进化体系建设：依托前沿大模型，设定相应规则、经验约束与工具边界，…
