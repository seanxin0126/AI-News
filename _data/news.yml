- title: 微软的最新披露显示其AI业务收入主要来自OpenAI
  description: 微软最新披露的信息显示，其大部分人工智能（AI）业务收入来自OpenAI。微软上周在监管文件中表示，截至6月的一年里，该公司从OpenAI录得241亿美元收入。微软首席执行官Satya
    Nadella此前表示，截至3月季度末，公司AI业务按全年计算的收入规模有望达到370亿美元。微软上周公布第四财季业绩时，并未更新AI总销售额。上述披露显示，在最近一个财年，OpenAI占微软AI销售额的一半以上，很可能约70%，凸显微软高度依赖这一关系密切的合作伙伴。（新浪财经）
