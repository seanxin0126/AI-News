- title: 打破机器人「数据焦虑」，穹彻智能想建一条「训练数据」生产线
  description: '如果说 2025 年是具身智能爆发的一年，那么今年，行业竞争已经开始进入新的阶段。

    从国内外越来越多机器人公司发布新产品，到资本持续加码，具身智能正成为 AI 领域最受关注的方向之一。但随着行业快速发展，一个新的共识正在形成：真正限制机器人进化速度的，不再只是模型，而是数据。

    与大语言模型可以利用互联网海量文本不同，机器人需要学习的是现实世界中的操作能力。一次抓取、一段搬运、一场整理任务，都需要真实发生，并同步记录视觉、动作、轨迹等多模态信息。如何持续获得高质量数据，并将这些数据快速转化为模型能够学习的数据集，成…'
