- title: 绕过美国HBM禁令 华虹与长鑫存储等中企押注定制化DRAM以寻找突破口
  description: "由于受到美国出口管制的约束，中国内存芯片巨头长鑫存储（CXMT）在获取生产高带宽内存（HBM）所需的先进设备方面面临重重阻碍，难以在主流AI内存市场上与国际巨头直接竞争。然而，最新业界动态显示，长鑫存储正试图通过转向“定制化DRAM”来辟蹊径，寻找突破口。\r\
    \n报道指出，随着人工智能硬件的发展重点逐渐从单纯依靠GPU算力扩展至提升高速内存性能，长鑫存储将战略重点转向了3D集成电路（3D IC）和3D DRAM技术。这种新型架构设计有望在不依赖传统HBM设备的前提下，有效解决数据传输的性能瓶颈。据了解，已有不少无晶圆…"
