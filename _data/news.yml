- title: Stripe收购OpenRouter
  description: Stripe周三表示，计划收购初创公司OpenRouter，这家金融科技公司正扩展至人工智能模型市场。交易条款未披露，知情人士称，交易价格约为75亿美元，其中15亿美元分配给OpenRouter创始人。不到三个月前，OpenRouter刚刚以约13亿美元的估值融资1.13亿美元。（新浪财经）
