  description: "9月1日上午，由中央网信办网络社会工作局、北京市委网信办主办，新京报贝壳财经承办的“中国式现代化的万千气象”网络名人北京行活动走进海淀区。网络名人一行先后参观利亚德集团总部、中关村低空技术产业创新中心、AI原点社区、中关村国家自主创新示范区展示中心、城市更新及产业升级人工智能聚集地与银河通用，沿着科技创新的脉络，感受北京向新发展的速度。\n\
