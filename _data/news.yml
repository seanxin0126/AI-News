- title: 消息人士：Anthropic预计2028年营收将达到约1900亿至2000亿美元
  description: '当地时间8月14日，据报道，随着Anthropic正在筹备可能成为史上最大规模IPO之一，华尔街比往常更长远地展望未来，以对这家人工智能公司进行估值，其估值依据是该公司两年后可能产生的营收。


    据两位熟悉该公司财务状况的人士透露，Anthropic预计2028年营收将达到约1900亿至2000亿美元，这一数字此前未被披露过。


    报道称，四位消息人士称，银行家和投资者正在使用基于预测的企业价值与营收倍数进行估值。对于尚未建立成熟盈利模式的高增长软件公司而言，采用营收倍数估值法是常见做法。（界面）'
  url: https://36kr.com/newsflashes/3940112887348355?f=rss
  source: 36kr.com
