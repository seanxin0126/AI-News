- title: 《西雅图时报》和《新闻日报》起诉OpenAI和微软，指控其侵犯版权
  description: 当地时间9月4日，据报道，《西雅图时报》和《新闻日报》于周五向OpenAI和微软提起诉讼，指控这两家科技公司在未经许可的情况下，擅自复制两家报纸的新闻报道内容，用于训练其人工智能系统，该诉讼已提交至美国纽约南区联邦地区法院。这两家分别位于西雅图和纽约长岛的报纸表示，被告的人工智能产品能够复制其报道中的段落、对文章进行高度概括，并向用户提供答案，从而降低了用户访问其网站或购买订阅的必要性。报道称，《西雅图时报》和《新闻日报》正寻求法院发布命令，要求销毁其作品的副本，以及包含这些作品的训练数据集或人工智能模型。（界面…
  url: https://36kr.com/newsflashes/3970187296141832?f=rss
