- title: OneRail联合英伟达推出面向零售商的人工智能平台，助力其更快做出配送决策
  description: 物流企业OneRail即将推出一款平台，该平台采用英伟达人工智能软件，助力零售商大规模快速选定最高效的配送方案。这款名为OmniStar的全新平台，依托OneRail的专有数据，让零售商借助人工智能评估全部配送选项，为每一笔独立订单筛选最优配送方案。OneRail介绍，以往为包裹选定最优配送路线可能需要20分钟，借助人工智能，该平台仅需2分30秒即可完成。（财联社）
