- title: 自研微米级工业具身机器人，已进入博世产线，「国奥科技」完成近亿元A+轮融资 | 36氪首发
  description: "2026年被业界视为“人形机器人量产元年”，然而数量扩张不等于产业成熟，部分企业仍停留在样机和演示阶段，商业化路径尚不清晰。\n “现在3C大厂基本不会考虑使用泛化的人形机器人。”国奥科技创始人李思阳博士说。\n\
    \ 在他看来，产量与工业场景落地之间的鸿沟不是AI大模型不够强，而是本体的运动控制能力远远无法达到工业场景要求。“好比一个人的大脑已经发育到二十岁，身体还停留在三岁的水平。”\n\
    \ 国奥科技正在尝试补齐这块短板。基于其自研多自由度电机（即同时实现直线和旋转运动的双自由度电机）生产的工业机器人，目前已销售给德国博世，…"
