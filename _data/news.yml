- title: 高盛等机构预计韩元有进一步上涨空间，AI热潮将带来资金流入
  description: 受人工智能热潮带来的资金流推动，韩元已从亚洲表现最差的货币转变为表现最佳货币，策略师们认为未来还有进一步上涨空间。法国巴黎银行表示，随着韩国芯片企业从海外带回资金以扩大生产，韩元有望延续涨势，但上涨步伐可能较为缓慢。高盛集团表示，韩国股市上涨吸引的股权资金流入，也将支撑韩元。法国外贸银行认为，韩国的出口增长将提振韩元。高盛预计，未来12个月韩元兑美元汇率将升至1350，具体升值幅度取决于韩国Kospi指数的表现。（财联社）
  url: https://36kr.com/newsflashes/3964262850174216?f=rss
  source: 36kr.com
