- title: 上海：全面提升智能计算能力，探索异构计算、光计算、量子人工智能等创新架构
  description: 36氪获悉，上海印发《上海市加快推进新型工业化构建现代化产业体系“十五五”规划》。规划提出，全面提升智能计算能力，攻关高性能、低功耗、高效率的智算芯片，提升集群组网和云服务能力，探索异构计算、光计算、量子人工智能等创新架构；优化智算基础设施，构建城市算力网络。持续发力大模型，聚焦下一代大模型研发，攻克架构设计、训练优化等关键技术，推动芯片、大模型、智算云协同发展，构建自主生态。深入推进“模力聚申”行动，加快具身智能技术熟化，加强智能机器人自主全产业链布局，提升关键环节性能，推动在工业制造、物流装配、商业零售、医疗…
