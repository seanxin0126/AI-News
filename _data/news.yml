- title: QFII二季度调仓呈现“头部化”特征，外资机构纷纷看好中国AI产业链
  description: 今年二季度以来，外资积极布局A股。数据显示，截至二季度末，沪深港通北向资金持仓市值首次突破3万亿元人民币。而根据外资机构的调研及调仓动向，国内人工智能（AI）产业链的吸引力正持续凸显。彭博行业研究资深股票策略师陈明康表示，中国股市上涨动能有望延续。今年二季度，AI产业链机遇叠加人民币汇率韧性，提升了外资对A股的配置需求。（证券日报）
