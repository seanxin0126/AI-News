- title: 报道称AMD拟通过债券发行融资高达50亿美元
  description: 据报道，AMD拟通过债券发行融资高达50亿美元，或为该公司史上最大规模投资级债券发行，加入AI热潮驱动的企业发债浪潮。据知情人士透露，此次发行的最终规模尚未确定，可能根据需求进行调整。另一位知情人士表示，AMD将分四批发行票据，期限从3年到10年不等。最长期限品种的初始价格指引为较美国国债收益率溢价1.15个百分点。（财联社）
  url: https://36kr.com/newsflashes/3938621447748743?f=rss
