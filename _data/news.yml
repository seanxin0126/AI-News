- title: Anthropic：从未主张禁止开放权重模型
  description: Anthropic首席执行官达里奥·阿莫代伊当地时间7月27日发表文章称，Anthropic从未主张全面禁止开放权重AI模型。他表示，具备一定安全性的开放权重模型能够扩大AI技术获取范围，为企业、开发者和研究人员提供价值，但应通过针对性监管降低潜在风险。对于此前多家科技企业支持开放权重模型的公开信，阿莫代伊表示赞同开放模型能够扩大AI经济参与度、促进竞争并增强用户控制，但不同意“开放模型必然更容易建立安全防护”的观点。他认为，开放权重模型一旦发布，开发者将难以撤回或控制其使用方式，相关风险应通过严格测试而非预设判…
