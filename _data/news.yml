- title: 中国人工智能公司演语科技据悉考虑香港IPO
  description: 据知情人士透露，人工智能（AI）设计智能体Lovart背后的中国初创公司演语科技正考虑在香港进行首次公开募股（IPO）。知情人士称，该公司正就潜在的股票发售事宜与顾问进行初步磋商。因讨论为私下进行，这些知情人士要求匿名。与此同时，知情人士表示，演语科技接近通过一笔交易融资，本次融资将使该初创企业的估值达到30亿美元。（新浪财经）
  url: https://36kr.com/newsflashes/3926111163873417?f=rss
  source: 36kr.com
