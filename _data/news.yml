- title: 英媒：65%白领怀念没有AI的职场 三分之一担忧创造力受影响
  description: "7月26日，人工智能正在重塑白领工作的同时，也引发越来越多从业者对“AI出现前工作状态”的怀念。英国《金融时报》报道称，多项调查显示，不少白领认为，生成式AI并未完全减轻工作负担，反而带来了创造力下降、事实核查成本增加以及工作节奏加快等新问题。\r\
    \n咨询公司Adaptavist发布的一项调查显示，65%的白领员工经常怀念AI普及前的工作方式。约三分之一受访者认为生成式AI会抑制创造力，还有相近比例的人担忧AI被滥用。与此同时，近一半受访者表示，核查AI生成内容的真实性增加了工作负担，与AI能够减少重复劳动的预期形成…"
