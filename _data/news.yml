- title: 科技企业瞄准太空算力，产业有望迎来从0到1重大突破
  description: 当地时间8月5日，SpaceX在社交媒体上宣布，公司正与英伟达合作，共同开发设计StarmindAI1卫星计算载荷，每颗Starmind卫星都将搭载英伟达RubinGPU和VeraCPU，实现数据中心级太空计算能力。英伟达也在社交媒体上确认了这项合作并表示：“AI基础设施的下一个篇章，正迈向AI计算从未涉足的疆域。”我国在该领域的布局早已悄然展开，且步伐不断加快。目前，我国太空算力产业已经从理论探索迈入实质性的在轨验证与初步组网阶段。长江证券研报指出，太空算力有望成为中国算力供给的重要补充，产业有望迎来从0到1的…
