- title: 物理AI进入规模化验证期，场景和数据成投资方关注点
  description: 具身智能龙头宇树科技的首次公开发行（IPO），标志着物理人工智能（AI）赛道已迈入产业化验证和资本市场公开定价的新阶段。在此过程中，首程控股作为宇树科技的核心战略投资方，在即将兑现前期投入的同时，联合多方设立35亿元前沿科创新兴未来产业股权投资基金，专项重仓物理AI全产业链。据不完全统计，最近18个月，已有超百亿美元资金涌入物理AI赛道，仅8月份，就有飞捷科思、西湖数智、慧仑科技等公司密集拿到数亿元融资；值得关注的是，2025年物理AI行业50%的融资仍然是投向早期初创，2026年首轮融资占比则降至8%，92%的…
