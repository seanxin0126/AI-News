- title: 国联股份在内蒙古成立智算科技公司
  description: 36氪获悉，企查查App显示，近日，内蒙古呼云智算科技有限公司成立，法定代表人为魏力强，注册资本为1亿元，经营范围包含：互联网数据服务；人工智能硬件销售；人工智能通用应用系统；人工智能基础软件开发；5G通信技术服务等。企查查股权穿透显示，该公司由国联股份控股的北京智算多多科技有限公司全资持股。
  url: https://36kr.com/newsflashes/3944498903858313?f=rss
