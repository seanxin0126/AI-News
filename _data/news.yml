- title: 英伟达据悉本周接近达成140亿美元收购Hugging Face的交易
  description: 据知情人士透露，英伟达公司正就收购人工智能初创企业Hugging Face开展深度谈判，这笔交易总规模约可达140亿美元。一位因信息尚未公开而要求匿名的消息人士表示，英伟达最快可能于本周达成协议，以129亿美元收购Hugging
    Face。该消息人士称，交易中还将包含面向Hugging Face员工的10亿美元留任激励方案。知情人士表示，双方尚未签署最终协议，交易时间与具体条款仍存在变动可能。英伟达与Hugging
    Face的代表均拒绝置评。（新浪财经）
