- title: 对话昆仑行创始人任庚：车企做具身，未来入场是“战略必然”，现在切入是“战术投机”
  description: "一直以来，具身智能赛道有一种割裂现象——一方面是行业热钱涌动，吸引自动驾驶技术人才与院校学者，先后加入创业者的阵营；而另一方面，具身智能的商业化并不清晰，行业至今未能出现一家能攻坚大规模量产的企业。因而在资本狂欢的另一面，也有如金沙江创投合伙人朱啸虎之类的行业人士，“清仓式”看空具身智能赛道。\n\
    \ 昆仑行机器人恰恰切中了行业对量产落地能力的迫切期待，因而公司在尚未走完注册流程时，估值便已跻身独角兽，刷新具身赛道的独角兽产生速度。\n 据36氪此前报道，昆仑行机器人由前华为国家CEO，阿里集团副总裁任庚，与前理想辅助驾…"
