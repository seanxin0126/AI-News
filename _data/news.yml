- title: 韩国智库上调今年经济增长预期至3.2%，因AI需求强劲
  description: 韩国一国营智库上调今年的经济增长预期，超政府预期。预计人工智能推动的全球半导体行业繁荣将强于预期，从而带动出口和投资。韩国开发研究院报告称，预计2026年经济增长率为3.2%，高于5月份预测的2.5%，理由是全球芯片需求强劲，预计将对当地经济产生积极影响。这一修正后的预测高于政府此前预测的3%和国际货币基金组织上个月发布的2.6%的预测值。（新浪财经）
  url: https://36kr.com/newsflashes/3945938698763395?f=rss
  source: 36kr.com
