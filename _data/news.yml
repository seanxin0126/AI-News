- title: 中芯国际赵海军：下半年人工智能产生的产业推动与溢出效应还将持续
  description: 8月14日，中芯国际联合CEO赵海军在二季度业绩会上分析，展望下半年，人工智能产生的产业推动与溢出效应还将持续，为集成电路制造带来广泛的需求。公司灵活调配已有产能，快速验证新增产能，帮助缓解产业链紧缺局面。同时公司也看到，供应链成本上升的压力已经向制造环节传导，公司将积极应对、克服困难，努力将影响降至最低。（证券时报）
