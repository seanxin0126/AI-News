- title: AI算力需求催热上半年业绩，MLCC产业链高景气度下半年将延续
  description: 今年以来，受益于AI算力需求爆发，素有“电子工业大米”之称的MLCC（片式多层陶瓷电容器）供应紧俏，价格持续上涨，带动被动元器件行业景气度回升，多家上市公司预计上半年业绩实现大幅增长，最高增幅超过6倍。展望下半年，有行业人士向记者表示，7月以来，MLCC价格整体平稳，品类内部价格则分化加剧，AI和车规级高端高容产品价格继续上涨。在AI服务器需求旺盛、原厂产能被锁定、上游贵金属等原材料价格居高的背景下，预计下半年高端高容MLCC价格将继续上涨，并有望推高被动元器件市场整体景气度。（上证报）
