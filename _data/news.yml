- title: 商务部新增84个全国重点外资项目，福建奔驰二期等在列
  description: 近日，商务部新增84个全国重点外资项目，其中包括6个外资标志性项目：阿斯利康全球战略研发中心项目、庆鼎人工智能服务器和高速光模块高密度互连积层板项目、沙特水电公司绿电直连项目、和睦家北京医疗国际创新中心投资项目、福建奔驰二期建设项目、云顶集团国投吉能2*745兆瓦级燃气发电项目，总投资额194.6亿美元。（21世纪经济报道）
