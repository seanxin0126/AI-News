- title: 韩国7月ICT出口达534亿美元，同比飙升140.6%
  description: 韩国政府周五公布的数据显示，受全球对人工智能（AI）持续投资的推动，韩国7月份信息通信技术（ICT）产品出口额同比增长140.6%。韩国科技信息通信部在一份新闻稿中表示，上月ICT产品出口额达到534亿美元，远高于去年同期的222亿美元，创下历史同月最高。（新浪财经）
