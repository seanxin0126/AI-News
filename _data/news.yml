- title: AI优化视觉皮层假体电刺激模式
  description: 包括美国加州大学圣巴巴拉分校在内的3家机构研究人员最新研究表明，人工智能（AI）有望让未来视觉假体（如“仿生眼”）更加精准、可预测并适应个体差异。研究人员利用深度学习模型优化植入大脑视觉皮层的“仿生眼”的电刺激模式，提高了对神经响应的控制和视觉感知预测能力。这标志着向开发能更有效与大脑沟通的视觉皮层假体迈出了重要一步。相关概念验证研究在线发表于最新一期《神经元》杂志。（科技日报）
  url: https://36kr.com/newsflashes/3934320779885953?f=rss
  source: 36kr.com
