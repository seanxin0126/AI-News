- title: 宇树科技王兴兴：公司正在推进让物理AI机器人模型自进化
  description: 宇树科技董事长王兴兴在论坛上表示，过去多年，AI多用于编程和开发，但在机器人领域的应用仍显不足。所以公司最近一段时间在推动的事情就是，直接让物理AI机器人模型自进化。“就是使用目前最前沿的顶尖AI大模型来驱动，然后我们自己定一些规则，定一些经验，包括定一些约束和工具，让它自己去网上搜索最新的一些论文，最好的一些研究成果，最好的一些各种的一些开源方案，让它自己去编程，生成自己的机器的控制代码。”王兴兴说，控制代码生成以后，它可以在仿真环境里面运行，或者去生成一些、调用一些大模型，然后去控制一个实物机器人，在实物机器…
