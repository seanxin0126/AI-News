- title: 北京银行：智能体创作平台累计搭建智能体300余个
  description: 北京银行2026年半年度报告显示，该行纵深推进人工智能应用，发布智算平台，实现AI资产统一纳管及模型访问统一入口；智能体创作平台累计搭建智能体300余个，在信贷审批、财富管理、风险防控等核心领域规模化落地高价值场景，为业务发展提质增效筑牢数字底座；深化企业知识库建设，覆盖合规、零售、金融研究等领域；完成DeepSeek-V4、Kimi-K2.6等前沿模型部署，引入多模态模型，打造超级智能体，推动智能体从“对话交互”向“执行任务的行动者”演进。
