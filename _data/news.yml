- title: OpenAI发布关于Hugging Face AI智能体黑客事件的详尽报告
  description: OpenAI周三发布了一份技术报告，详细说明了其人工智能模型上个月如何成功入侵Hugging Face，这一事件曾震惊了科技行业的研究人员和高管。这份37页的报告详述了OpenAI模型在入侵前及入侵期间的一系列评估中所采取的行动，OpenAI将此次事件定性为“前所未有的网络安全事件”。该公司还解释了为防止类似事件再次发生所采取的步骤，主要包括改进其安全与隔离、监控、模型行为及事件响应能力。（新浪财经）
  url: https://36kr.com/newsflashes/3956962166897795?f=rss
  source: 36kr.com
- title: “十五五”时期我国将加快培育“人工智能+”“机器人+”等重大应用场景
  description: 8月26日，国新办举行“开局起步‘十五五’”系列主题新闻发布会，工业和信息化部相关负责人介绍全力抓好“十五五”规划实施、加快推进新型工业化有关情况。发布会上介绍，“十五五”时期，我国将抓好场景培育，推动新技术新产品新场景大规模应用加速成势。开展制造业新技术新产品新场景大规模应用示范，加快培育“5G+”“人工智能+”“机器人+”“工业互联网+”“北斗+”等重大应用场景，完善标志性项目遴选、新技术新产品新场景清单发布、供需对接等机制，一体推进创新成果在真实场景中测试验证、迭代升级、产业化落地、大规模应用。（央视新闻）
  url: https://36kr.com/newsflashes/3955740946103683?f=rss
