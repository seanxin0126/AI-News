- title: 订单排到年底，千亿液冷赛道加速升温
  description: 全球AI硬件功耗持续攀升，传统风冷散热瓶颈凸显。随着新建智算中心加速落地、传统机房风冷改液冷需求集中释放，液冷产业迎来爆发增长期，多家液冷企业订单排至年底。据了解，当前传统的风冷技术不能很好解决高功率算力芯片散热问题，全浸没式液冷成为一种解决方案，就像给发烫的服务器“泡冷水澡”。近日，国内首个浸没式液冷算力方舱投入运行，对四种不同冷却液进行严苛的兼容性测试。这个项目聚焦算力方舱液冷冷却液的研究，研发出兼具经济性与散热性的低价冷却液，同时基于硅油、合成油、再生变压器油及氟化液四种冷却液进行兼容性研究，破解数据中心高…
